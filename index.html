<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>АдалинКонсалт — кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f3f5);
    --text: var(--tg-theme-text-color, #1f2328);
    --hint: var(--tg-theme-hint-color, #7b8189);
    --link: var(--tg-theme-link-color, #1f4e5f);
    --btn: var(--tg-theme-button-color, #1f4e5f);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --danger: #c0392b; --warn: #b7791f; --ok: #2f855a;
    --line: color-mix(in srgb, var(--hint) 25%, transparent);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg2); color: var(--text); }
  header { background: var(--bg); padding: 12px 16px 8px; position: sticky; top: 0; z-index: 5; border-bottom: 1px solid var(--line); }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .sub { color: var(--hint); font-size: 13px; }
  .test { background: #fff4d6; color: #7a5a00; font-size: 12px; padding: 6px 16px; }
  select, input, textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
  textarea { min-height: 70px; resize: vertical; }
  .as { margin-top: 8px; }
  nav { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; }
  nav button { flex: 0 0 auto; border: 0; background: var(--bg2); color: var(--text); padding: 7px 12px; border-radius: 16px; font: inherit; font-size: 14px; }
  nav button.on { background: var(--btn); color: var(--btn-text); }
  main { padding: 12px 12px 90px; }
  .sec { font-size: 13px; text-transform: uppercase; letter-spacing: .03em; color: var(--hint); margin: 16px 4px 6px; }
  .card { background: var(--bg); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .card.tap { cursor: pointer; }
  .row { display: flex; justify-content: space-between; gap: 4px 10px; align-items: baseline; flex-wrap: wrap; }
  .row > span:last-child { white-space: nowrap; }
  .t { font-weight: 600; }
  .muted { color: var(--hint); font-size: 13px; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--bg2); color: var(--hint); white-space: nowrap; }
  .b-over { background: #fde8e6; color: var(--danger); }
  .b-wait { background: #fff4d6; color: var(--warn); }
  .b-done { background: #e6f4ec; color: var(--ok); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .chips button { border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 5px 10px; border-radius: 14px; font: inherit; font-size: 13px; }
  .chips button.on { border-color: var(--btn); color: var(--btn); font-weight: 600; }
  .empty { text-align: center; color: var(--hint); padding: 30px 10px; }
  .err { background: #fde8e6; color: var(--danger); border-radius: 10px; padding: 12px; margin: 12px; }
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 20; }
  .sheet.open { display: flex; align-items: flex-end; }
  .panel { background: var(--bg); width: 100%; max-height: 92vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 16px 16px 28px; }
  .panel h2 { font-size: 17px; margin: 0 0 4px; }
  label { display: block; font-size: 13px; color: var(--hint); margin: 12px 0 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg { display: flex; gap: 4px; background: var(--bg2); padding: 3px; border-radius: 10px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--text); padding: 7px 4px; border-radius: 8px; font: inherit; font-size: 13px; }
  .seg button.on { background: var(--bg); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .btn { display: block; width: 100%; border: 0; border-radius: 10px; padding: 12px; font: inherit; font-weight: 600; background: var(--btn); color: var(--btn-text); margin-top: 14px; }
  .btn.sec2 { background: var(--bg2); color: var(--text); }
  .box { background: var(--bg2); border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
  .kv { display: grid; grid-template-columns: 45% 55%; gap: 4px 8px; font-size: 14px; }
  .kv div:nth-child(odd) { color: var(--hint); }
  .sum { font-weight: 600; white-space: nowrap; }
  .loading { text-align: center; padding: 40px; color: var(--hint); }
</style>
</head>
<body>
<header>
  <h1 id="title">АдалинКонсалт</h1>
  <div class="sub" id="subtitle">Загрузка…</div>
  <div class="as" id="asBox" style="display:none"><select id="asSel"></select></div>
  <nav id="tabs"></nav>
</header>
<div class="test" id="testBar" style="display:none">Тестовый режим: сообщения клиентам уходят только руководителю.</div>
<main id="main"><div class="loading">Загрузка…</div></main>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const API = new URLSearchParams(location.search).get('api');
const S = { data: null, as: null, tab: null, filter: 'open', emp: '' };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = v => (v === '' || v == null) ? '' : Number(v).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).replace(/ /g, ' ');

async function call(action, params) {
  if (!API) throw new Error('Не указан адрес сервера. Откройте кабинет кнопкой в боте.');
  if (!tg || !tg.initData) throw new Error('Откройте кабинет из Telegram — кнопкой «Кабинет» в боте.');
  const body = JSON.stringify({ initData: tg.initData, action, params: Object.assign({}, params, S.as ? { as: S.as } : {}) });
  const r = await fetch(API, { method: 'POST', body, redirect: 'follow' });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Ошибка сервера');
  return j;
}
async function load(action = 'me', params = {}) {
  try {
    S.data = await call(action, params);
    render();
    return true;
  } catch (e) {
    showError(e.message);
    return false;
  }
}
function showError(msg) {
  if (tg && tg.showAlert) tg.showAlert(msg); else alert(msg);
  if (!S.data) $('main').innerHTML = '<div class="err">' + esc(msg) + '</div>';
}

// ---------- шапка ----------
function render() {
  const d = S.data;
  $('testBar').style.display = d.test ? 'block' : 'none';
  if (d.isManager) {
    $('asBox').style.display = 'block';
    const cur = S.as ? S.as.role + '|' + (S.as.name || S.as.code) : '';
    $('asSel').innerHTML = '<option value="">Я — руководитель (все задачи)</option>' +
      '<optgroup label="Смотреть как сотрудник">' + (d.employees || []).map(e => `<option value="сотрудник|${esc(e)}">${esc(e)}</option>`).join('') + '</optgroup>' +
      '<optgroup label="Смотреть как клиент">' + (d.clients || []).map(c => `<option value="клиент|${esc(c.code)}">${esc(c.name)}</option>`).join('') + '</optgroup>';
    $('asSel').value = cur;
  }
  const tabs = d.role === 'клиент'
    ? [['dl', 'Сроки'], ['need', 'Что нужно от вас' + (d.requests.length ? ' (' + d.requests.length + ')' : '')], ['rep', 'Отчёты']]
    : [['tasks', 'Задачи'], ['reqs', 'Запросы' + (d.requests.length ? ' (' + d.requests.length + ')' : '')], ['cl', 'Клиенты']];
  if (!tabs.some(t => t[0] === S.tab)) S.tab = tabs[0][0];
  $('tabs').innerHTML = tabs.map(t => `<button class="${t[0] === S.tab ? 'on' : ''}" data-tab="${t[0]}">${t[1]}</button>`).join('');
  $('title').textContent = d.role === 'клиент' ? d.clientName : 'АдалинКонсалт — CRM';
  $('subtitle').textContent = d.role === 'клиент' ? 'Кабинет клиента' + (d.viaManager ? ' (просмотр руководителем)' : '')
    : (d.role === 'руководитель' ? 'Руководитель' : 'Сотрудник: ' + d.name + (d.viaManager ? ' (просмотр руководителем)' : ''));
  ({ tasks: renderTasks, reqs: renderReqs, cl: renderClients, dl: renderDeadlines, need: renderNeed, rep: renderReports })[S.tab]();
}
$('asSel').addEventListener('change', e => {
  const v = e.target.value;
  if (!v) S.as = null; else { const [role, x] = v.split('|'); S.as = role === 'клиент' ? { role, code: x } : { role, name: x }; }
  S.tab = null; $('main').innerHTML = '<div class="loading">Загрузка…</div>'; load();
});
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { S.tab = b.dataset.tab; render(); } });

// ---------- сотрудник / руководитель ----------
function statusBadge(t) {
  if (t.overdue) return '<span class="badge b-over">просрочено</span>';
  const s = String(t['Статус']).toLowerCase();
  if (s === 'выполнено') return '<span class="badge b-done">выполнено</span>';
  if (s === 'ожидает клиента') return '<span class="badge b-wait">ждём клиента</span>';
  return '<span class="badge">' + esc(t['Статус'] || 'к выполнению') + '</span>';
}
function sumLine(t) {
  if (t.kind === 'zp') return t['Сумма к выплате'] !== '' ? 'К выплате ' + money(t['Сумма к выплате']) + ' BYN' : 'Суммы не внесены';
  if (t.kind === 'tax' || t.kind === 'avans') return t['Сумма'] !== '' ? money(t['Сумма']) + ' BYN' : 'Сумма не внесена';
  return '';
}
function taskCard(t) {
  return `<div class="card tap" data-id="${esc(t.id)}">
    <div class="row"><div class="t">${esc(t.client)}</div>${statusBadge(t)}</div>
    <div>${esc(t.title)}</div>
    <div class="row muted"><span>Срок ${esc(t.deadline)}${t.payDate && t.payDate !== t.deadline ? ' · уплата ' + esc(t.payDate) : ''}</span><span>${esc(sumLine(t))}</span></div>
    ${S.data.role === 'руководитель' ? `<div class="muted">${esc(t.employee)}</div>` : ''}
    ${t.request ? `<div class="muted">Запрос клиенту от ${esc(t.request.date)}: ${esc(t.request.text)}</div>` : ''}
  </div>`;
}
function renderTasks() {
  const d = S.data;
  let list = d.tasks.slice();
  if (d.role === 'руководитель' && S.emp) list = list.filter(t => t.employee === S.emp);
  const f = S.filter;
  if (f === 'open') list = list.filter(t => String(t['Статус']).toLowerCase() !== 'выполнено');
  if (f === 'over') list = list.filter(t => t.overdue);
  if (f === 'wait') list = list.filter(t => String(t['Статус']).toLowerCase() === 'ожидает клиента');
  if (f === 'done') list = list.filter(t => String(t['Статус']).toLowerCase() === 'выполнено');
  const chips = [['open', 'Открытые'], ['over', 'Просрочено'], ['wait', 'Ждём клиента'], ['done', 'Выполнено']]
    .map(c => `<button class="${c[0] === f ? 'on' : ''}" data-f="${c[0]}">${c[1]}</button>`).join('');
  const empSel = d.role === 'руководитель'
    ? `<select id="empSel" style="margin-bottom:8px"><option value="">Все сотрудники</option>${d.employees.map(e => `<option ${e === S.emp ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select>` : '';
  $('main').innerHTML = empSel + `<div class="chips">${chips}</div>` +
    (list.length ? list.map(taskCard).join('') : '<div class="empty">Задач нет</div>');
  $('main').querySelectorAll('.chips button').forEach(b => b.onclick = () => { S.filter = b.dataset.f; renderTasks(); });
  if ($('empSel')) $('empSel').onchange = e => { S.emp = e.target.value; renderTasks(); };
  $('main').querySelectorAll('.card.tap').forEach(c => c.onclick = () => openTask(c.dataset.id));
}
function field(name, label, value, type = 'text') {
  return `<div><label>${label}</label><input data-f="${name}" type="text" inputmode="${type === 'num' ? 'decimal' : 'text'}" value="${esc(type === 'num' && value !== '' ? money(value) : value)}"></div>`;
}
function openTask(id) {
  const t = S.data.tasks.find(x => x.id === id);
  if (!t) return;
  const st = String(t['Статус']).toLowerCase();
  const seg = ['к выполнению', 'в работе', 'выполнено'].map(s => `<button data-s="${s}" class="${s === st ? 'on' : ''}">${s}</button>`).join('');
  let sums = '';
  if (t.kind === 'zp') sums = `<div class="grid2">${field('Сумма к выплате', 'К выплате, BYN', t['Сумма к выплате'], 'num')}${field('Подоходный', 'Подоходный, BYN', t['Подоходный'], 'num')}</div>
      <div class="grid2">${field('ФСЗН', 'ФСЗН, BYN', t['ФСЗН'], 'num')}${field('Белгосстрах', 'Белгосстрах, BYN', t['Белгосстрах'], 'num')}</div>`;
  if (t.kind === 'tax' || t.kind === 'avans') sums = field('Сумма', 'Сумма к уплате, BYN (0 — платить нечего)', t['Сумма'], 'num');
  const pay = t.kind !== 'none' ? `<label>Платёжка</label><select data-f="Платёжка">${['не подготовлена', 'подготовлена', 'клиент платит сам']
    .map(v => `<option ${v === t['Платёжка'] ? 'selected' : ''}>${v}</option>`).join('')}</select>` : '';
  const reasons = S.data.reasons.map(r => `<option value="${esc(r.code)}">${esc(r.label)}</option>`).join('');
  const req = t.request
    ? `<div class="box"><div class="t">Запрос клиенту от ${esc(t.request.date)}</div><div>${esc(t.request.text)}</div>
         <button class="btn sec2" id="closeReq">Клиент прислал — закрыть запрос</button></div>`
    : `<div class="box"><div class="t">Нужно что-то от клиента?</div>
         <label>Причина</label><select id="rsn">${reasons}</select>
         <label>Что именно (увидит клиент)</label><textarea id="rtxt" placeholder="Например: выписка по счёту в Беларусбанке за 01–15.10"></textarea>
         <button class="btn sec2" id="sendReq">Отправить запрос клиенту</button>
         <div class="muted" style="margin-top:6px">Клиент получит сообщение сразу. Без ответа — повтор на следующий рабочий день, затем вопрос уйдёт руководителю.</div></div>`;
  $('panel').innerHTML = `<h2>${esc(t.title)}</h2>
    <div class="muted">${esc(t.client)} · отчётный период: ${esc(t.period)}</div>
    <div class="muted">Срок задачи ${esc(t.deadline)}${t.payDate ? ' · срок уплаты ' + esc(t.payDate) : ''}${S.data.role === 'руководитель' ? ' · ' + esc(t.employee) : ''}</div>
    <label>Статус</label><div class="seg" id="seg">${seg}</div>
    ${sums}${pay}
    ${field('Итог для клиента', 'Итог для клиента (попадёт в отчёт)', t['Итог для клиента'])}
    <label>Внутренний комментарий (клиент не видит)</label><textarea data-f="Внутренний комментарий">${esc(t['Внутренний комментарий'])}</textarea>
    <button class="btn" id="save">Сохранить</button>
    ${req}
    <button class="btn sec2" id="cancel">Закрыть</button>`;
  let status = t['Статус'];
  $('seg').onclick = e => { const b = e.target.closest('button'); if (!b) return; status = b.dataset.s; $('seg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };
  $('cancel').onclick = closeSheet;
  $('save').onclick = async () => {
    const fields = { 'Статус': status };
    $('panel').querySelectorAll('[data-f]').forEach(el => fields[el.dataset.f] = el.value);
    busy($('save'));
    if (await load('task.update', { id: t.id, fields })) { haptic(); closeSheet(); } else unbusy($('save'), 'Сохранить');
  };
  if ($('sendReq')) $('sendReq').onclick = async () => {
    const text = $('rtxt').value.trim();
    if (!text) return showError('Допишите, что именно нужно от клиента.');
    busy($('sendReq'));
    if (await load('request.open', { taskId: t.id, reason: $('rsn').value, text })) { haptic(); closeSheet(); } else unbusy($('sendReq'), 'Отправить запрос клиенту');
  };
  if ($('closeReq')) $('closeReq').onclick = async () => {
    busy($('closeReq'));
    if (await load('request.close', { id: t.request.id })) { haptic(); closeSheet(); } else unbusy($('closeReq'), 'Клиент прислал — закрыть запрос');
  };
  $('sheet').classList.add('open');
}
function closeSheet() { $('sheet').classList.remove('open'); }
$('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
function busy(b) { b.disabled = true; b.textContent = 'Сохраняю…'; }
function unbusy(b, t) { b.disabled = false; b.textContent = t; }
function haptic() { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); }

function renderReqs() {
  const r = S.data.requests;
  $('main').innerHTML = r.length ? r.map(q => `<div class="card">
      <div class="row"><div class="t">${esc(q.client)}</div>${q.escalated ? '<span class="badge b-over">у руководителя</span>' : q.repeated ? '<span class="badge b-wait">повтор отправлен</span>' : '<span class="badge">открыт</span>'}</div>
      <div>${esc(q.text)}</div>
      <div class="muted">${esc(q.task)} · с ${esc(q.date)}</div>
      <button class="btn sec2" data-close="${esc(q.id)}">Клиент прислал — закрыть</button></div>`).join('')
    : '<div class="empty">Открытых запросов нет</div>';
  $('main').querySelectorAll('[data-close]').forEach(b => b.onclick = async () => { busy(b); if (!(await load('request.close', { id: b.dataset.close }))) unbusy(b, 'Клиент прислал — закрыть'); });
}
function renderClients() {
  const c = S.data.clientCards;
  $('main').innerHTML = c.length ? c.map(x => `<div class="card">
      <div class="row"><div class="t">${esc(x.name)}</div><span class="badge">${esc(x.status)}</span></div>
      <div class="kv" style="margin-top:6px">
        <div>Тип, режим</div><div>${esc(x.type)}, ${esc(x.regime)}</div>
        <div>Плательщик НДС</div><div>${esc(x.vat)}</div>
        <div>Работники</div><div>${esc(x.staff)}${String(x.staff) === 'да' ? ` (ЗП ${esc(x.zpDay)}-го, аванс ${esc(x.avDay)}-го)` : ''}</div>
        <div>Платёжки ЗП / налоги</div><div>${esc(x.payZp)} / ${esc(x.payTax)}</div>
        <div>Контакт</div><div>${esc(x.contact)}</div>
        <div>Telegram клиента</div><div>${esc(x.telegram)}</div>
        ${S.data.role === 'руководитель' ? `<div>Ответственный</div><div>${esc(x.employee)}</div>` : ''}
      </div></div>`).join('') : '<div class="empty">Нет закреплённых клиентов</div>';
}

// ---------- клиент ----------
function renderDeadlines() {
  const d = S.data.deadlines;
  $('main').innerHTML = '<div class="sec">Ближайшие 45 дней</div>' + (d.length ? d.map(x => `<div class="card">
      <div class="row"><div class="t">${esc(x.date)}</div><div class="sum">${esc(x.sum)} BYN</div></div>
      <div>${esc(x.what)}</div>
      ${x.extra ? `<div class="muted">${esc(x.extra)}</div>` : ''}
      ${x.prepared ? '<div class="muted">Платёжка подготовлена в банк-клиенте — подпишите её.</div>' : ''}
    </div>`).join('') : '<div class="empty">Ближайших платежей нет</div>');
}
function renderNeed() {
  const r = S.data.requests;
  $('main').innerHTML = r.length ? r.map(x => `<div class="card"><div class="muted">${esc(x.date)}</div><div>${esc(x.text)}</div></div>`).join('') +
    '<div class="muted" style="padding:4px 6px">Документы и ответы присылайте в чат с ботом — мы передадим их вашему бухгалтеру.</div>'
    : '<div class="empty">Сейчас от вас ничего не нужно</div>';
}
function renderReports() { $('main').innerHTML = '<div class="empty">Здесь будут отчёты о выполненной работе.</div>'; }

load();
</script>
</body>
</html>
