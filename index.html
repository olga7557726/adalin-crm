<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>АдалинКонсалт — CRM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #f4f5f2; --panel: #ffffff; --line: #e3e4de; --line2: #cfd1c8;
  --text: #1c2230; --muted: #687080; --muted2: #8b919c;
  --accent: #27466e; --accent-2: #1b3354; --accent-weak: #e8eef6;
  --danger: #b42318; --danger-weak: #fdecea; --warn: #9a5b00; --warn-weak: #fdf3dc;
  --ok: #1e7a4c; --ok-weak: #e5f4ec; --radius: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.hidden { display: none !important; }

/* ---------- каркас ---------- */
.app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; }
.logo { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; }
.brand b { display: block; font-size: 14px; } .brand span { font-size: 12px; color: var(--muted); }
.nav { padding: 6px 10px; overflow-y: auto; flex: 1; }
.nav-sec { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted2); margin: 14px 10px 6px; }
.nav button { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px; border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--text); }
.nav button:hover { background: #f1f2ee; }
.nav button.on { background: var(--accent-weak); color: var(--accent); font-weight: 600; }
.nav button[disabled] { color: var(--muted2); cursor: default; background: none; }
.nav .cnt { font-size: 11px; background: var(--danger-weak); color: var(--danger); border-radius: 10px; padding: 1px 7px; font-weight: 600; }
.nav .soon { font-size: 10px; color: var(--muted2); border: 1px solid var(--line); border-radius: 8px; padding: 0 6px; }
.side-foot { border-top: 1px solid var(--line); padding: 12px 14px; font-size: 13px; }
.who { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.ava { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-weak); color: var(--accent); display: grid; place-items: center; font-weight: 700; flex: none; }
.who b { display: block; } .who span { color: var(--muted); font-size: 12px; }
.side-foot select { width: 100%; margin: 4px 0 8px; }
.linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 2px 0; margin-right: 12px; font-size: 13px; }
.main { min-width: 0; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 28px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 4; }
.top h2 { margin: 0; font-size: 17px; }
.top .right { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 13px; }
.pill { font-size: 12px; border-radius: 12px; padding: 2px 10px; border: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
.pill.warn { background: var(--warn-weak); color: var(--warn); border-color: #f1dfb2; }
.content { padding: 22px 28px 60px; max-width: 1320px; }
.testbar { background: var(--warn-weak); color: var(--warn); font-size: 12px; padding: 6px 28px; border-bottom: 1px solid #f1dfb2; }
.viewbar { background: var(--accent-weak); color: var(--accent); font-size: 12px; padding: 6px 28px; }

/* ---------- элементы ---------- */
.over { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.over::before { content: ""; width: 18px; height: 2px; background: var(--accent); }
h1.hero { font-size: 26px; margin: 6px 0 4px; letter-spacing: -.01em; }
.lead { color: var(--muted); margin: 0 0 18px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.pad { padding: 16px 18px; }
.kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 12px; }
.kpi { padding: 14px 16px; }
.kpi .l { font-size: 12px; color: var(--muted); } .kpi .v { font-size: 26px; font-weight: 650; margin-top: 4px; letter-spacing: -.01em; }
.kpi .s { font-size: 12px; color: var(--muted2); margin-top: 2px; }
.kpi.red .v { color: var(--danger); } .kpi.amber .v { color: var(--warn); }
.minis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 18px; }
.mini { padding: 10px 14px; } .mini .l { font-size: 12px; color: var(--muted); } .mini .v { font-size: 18px; font-weight: 600; }
.cols { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; margin-bottom: 16px; }
.stack { display: grid; gap: 16px; margin-bottom: 16px; }
.cols > .panel, .stack > .panel { min-width: 0; overflow-x: auto; }
.ph { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.ph h3 { margin: 0; font-size: 15px; } .ph span { color: var(--muted); font-size: 12px; }
.attn { list-style: none; margin: 8px 0 0; padding: 0; }
.attn li { display: flex; align-items: center; gap: 10px; padding: 11px 4px; border-top: 1px solid var(--line); cursor: pointer; }
.attn li:hover { background: #fafaf8; }
.attn .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.attn .t { flex: 1; } .attn .t small { display: block; color: var(--muted); font-size: 12px; }
.attn .n { font-weight: 650; font-size: 16px; }
.bar { height: 8px; background: #eceee8; border-radius: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.prog { display: grid; grid-template-columns: 1.3fr 2fr 70px; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; }
.prog:first-of-type { border-top: 0; }
.prog .r { text-align: right; color: var(--muted); font-size: 13px; }

table.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: #fafaf8; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: #fafaf8; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .sub { color: var(--muted); font-size: 12px; }
.tbl .num { text-align: right; white-space: nowrap; }
.tbl td.nm { min-width: 150px; }
.twrap { overflow-x: auto; }
.acts { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; min-width: 190px; }
.badge { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 10px; background: #eff0ec; color: var(--muted); white-space: nowrap; }
.b-over { background: var(--danger-weak); color: var(--danger); } .b-wait { background: var(--warn-weak); color: var(--warn); }
.b-done { background: var(--ok-weak); color: var(--ok); } .b-work { background: var(--accent-weak); color: var(--accent); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.toolbar .grow { flex: 1; }
input[type=text], input[type=password], select, textarea { border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; background: #fff; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-weak); border-color: var(--accent); }
textarea { width: 100%; min-height: 80px; resize: vertical; }
.chips { display: inline-flex; background: #eceee8; border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.chips button { border: 0; background: none; padding: 6px 11px; border-radius: 7px; cursor: pointer; color: var(--muted); font-size: 13px; }
.chips button.on { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--accent-2); }
.btn.ghost { background: #fff; color: var(--accent); border-color: var(--line2); }
.btn.ghost:hover { background: var(--accent-weak); }
.btn.danger { background: #fff; color: var(--danger); border-color: #f0c9c4; }
.btn.sm { padding: 5px 10px; font-size: 13px; font-weight: 500; }
.btn[disabled] { opacity: .6; cursor: wait; }
.empty { text-align: center; color: var(--muted); padding: 36px 12px; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.kv { display: grid; grid-template-columns: 200px 1fr; gap: 7px 16px; }
.kv > div:nth-child(odd) { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 12px 0 16px; }
.stats div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; } .stats b { display: block; font-size: 18px; } .stats span { font-size: 12px; color: var(--muted); }
.tabs2 { display: flex; gap: 18px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tabs2 button { border: 0; background: none; padding: 8px 0; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs2 button.on { color: var(--text); border-color: var(--accent); font-weight: 600; }
.steps { margin: 6px 0 0; padding-left: 22px; } .steps li { margin: 5px 0; }
.note { background: #fafaf8; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--muted); }
.regs { display: grid; grid-template-columns: 320px 1fr; gap: 16px; align-items: start; }
.reglist .grp { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted2); padding: 12px 14px 4px; }
.reglist button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 14px; cursor: pointer; border-left: 2px solid transparent; }
.reglist button:hover { background: #fafaf8; } .reglist button.on { background: var(--accent-weak); border-left-color: var(--accent); }
.reglist button small { display: block; color: var(--muted2); font-size: 12px; }

/* ---------- боковая панель и окна ---------- */
.shade { position: fixed; inset: 0; background: rgba(20,25,35,.32); z-index: 20; display: none; }
.shade.open { display: block; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--panel); z-index: 21; box-shadow: -8px 0 30px rgba(0,0,0,.12); transform: translateX(105%); transition: transform .18s ease; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer.wide { width: min(860px, 100%); }
.dh { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.dh h3 { margin: 0 0 3px; font-size: 16px; }
.x { border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); padding: 0 4px; }
.db { padding: 16px 20px 30px; overflow-y: auto; flex: 1; }
.db label, .modal label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
.db input[type=text], .db select, .modal input, .modal select { width: 100%; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.box { background: #fafaf8; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-top: 16px; }
.box h4 { margin: 0 0 2px; font-size: 14px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.modal { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100% - 32px)); max-height: 90vh; overflow-y: auto; background: var(--panel); border-radius: 12px; z-index: 31; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.2); }
.modal h3 { margin: 0 0 6px; }
.modal-shade { position: fixed; inset: 0; background: rgba(20,25,35,.4); z-index: 30; }
.copyrow { display: flex; gap: 6px; } .copyrow input { flex: 1; font-family: ui-monospace, Consolas, monospace; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1c2230; color: #fff; padding: 10px 16px; border-radius: 8px; z-index: 40; font-size: 13px; max-width: calc(100% - 32px); }
.toast.err { background: var(--danger); }
.loading { padding: 60px; text-align: center; color: var(--muted); }

.timerbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: #eaf4ee; color: #14532d; border-bottom: 1px solid #cfe6d8; padding: 8px 28px; font-size: 13px; }
.timerbar .tick { font-variant-numeric: tabular-nums; font-size: 15px; }
.timerbar .tb-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
.pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #1e7a4c; margin-right: 6px; animation: pulse 1.4s infinite; vertical-align: middle; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(30,122,76,.5); } 70% { box-shadow: 0 0 0 7px rgba(30,122,76,0); } 100% { box-shadow: 0 0 0 0 rgba(30,122,76,0); } }
.tplan { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.tplan > div { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.tplan span { display: block; font-size: 12px; color: var(--muted); }
.tplan b { font-size: 15px; }
.tbl.mini-t td { padding: 6px 6px; font-size: 13px; }
.btn .tick { font-variant-numeric: tabular-nums; color: #fff; opacity: .85; }

/* ---------- вход ---------- */
.login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.login .card { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 26px; }
.login h1 { font-size: 20px; margin: 14px 0 4px; }
.login label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 4px; }
.login input { width: 100%; padding: 10px 12px; }
.login .btn { width: 100%; margin-top: 18px; padding: 10px; }
.login .err { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 18px; }

/* ---------- телефон ---------- */
.mnav { display: none; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .side .nav, .side-foot .who span { display: none; }
  .brand { padding: 12px 16px; }
  .side-foot { padding: 8px 16px; border-top: 0; }
  .side-foot .who { display: none; }
  .mnav { display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .mnav button { flex: none; border: 1px solid var(--line); background: #fff; border-radius: 16px; padding: 6px 12px; cursor: pointer; }
  .mnav button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .top { padding: 12px 16px; position: static; } .content { padding: 16px 16px 50px; }
  .testbar, .viewbar, .timerbar { padding: 6px 16px; }
  .tbl.mini-t tr { display: grid; grid-template-columns: auto auto 1fr; } 
  .kpis, .minis { grid-template-columns: 1fr 1fr; }
  .cols, .regs { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(3, 1fr); }
  .kv { grid-template-columns: 1fr; gap: 0; } .kv > div:nth-child(even) { margin-bottom: 8px; }
  h1.hero { font-size: 21px; }
  .tbl thead { display: none; }
  .tbl, .tbl tbody, .tbl tr, .tbl td { display: block; width: 100%; }
  .tbl tr { border-bottom: 1px solid var(--line); padding: 8px 4px; }
  .tbl td { border: 0; padding: 2px 8px; }
  .tbl td[data-l]::before { content: attr(data-l) ": "; color: var(--muted); font-size: 12px; }
  .tbl .num { text-align: left; } .tbl td.nm { min-width: 0; } .acts { justify-content: flex-start; margin-top: 6px; }
  .prog { grid-template-columns: 1fr 70px; } .prog .bar { grid-column: 1 / -1; order: 3; }
  .g2 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="root"><div class="loading">Загрузка…</div></div>
<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer"></aside>
<div id="modalWrap"></div>
<script>
'use strict';
// ===================== связь с сервером =====================
const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) { /* не в Telegram */ } }
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* хранилище недоступно */ } },
};
const qsApi = new URLSearchParams(location.search).get('api');
if (qsApi) store.set('adalin_api', qsApi);
const API = qsApi || store.get('adalin_api') || '';
const S = { token: store.get('adalin_token'), data: null, as: null, view: null, drawer: null,
  f: { q: '', emp: '', client: '', period: '', st: 'open' }, regSel: null, regQ: '', progPeriod: '' };

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = v => (v === '' || v == null || isNaN(Number(v))) ? '' : Number(v).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const low = s => String(s == null ? '' : s).trim().toLowerCase();
const parseD = s => { const m = String(s || '').match(/^(\d{2})\.(\d{2})\.(\d{4})$/); return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null; };

async function call(action, params) {
  if (!API) throw new Error('Не указан адрес сервера. Откройте ссылку, которую прислал руководитель (она содержит «?api=…»).');
  const body = { action, params: Object.assign({}, params || {}, S.as && action !== 'login' ? { as: S.as } : {}) };
  if (S.token) body.token = S.token; else if (tg) body.initData = tg.initData;
  let j;
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify(body), redirect: 'follow' });
    j = await r.json();
  } catch (e) { throw new Error('Сервер не отвечает. Проверьте интернет и попробуйте ещё раз.'); }
  if (!j.ok && j.auth) { logoutLocal(); const e = new Error(S.data === null && action === 'me' ? '' : (j.error || 'Войдите снова.')); e.auth = true; throw e; }
  if (!j.ok) throw new Error(j.error || 'Ошибка сервера');
  return j;
}
async function act(action, params, btn) {
  const old = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Сохраняю…'; }
  try {
    const j = await call(action, params);
    if (j.mustChange) { S.data = null; renderPassword(true); return null; }
    S.data = j; render(); return j;
  } catch (e) { if (e.auth) { renderLogin(e.message || 'Сессия истекла. Войдите снова.'); return null; } toast(e.message, true); return null; }
  finally { if (btn && document.body.contains(btn)) { btn.disabled = false; btn.textContent = old; } }
}
function toast(msg, err) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 5000 : 2500);
}
function logoutLocal() { S.token = null; S.data = null; S.as = null; store.set('adalin_token', null); }

// ===================== вход и пароль =====================
function renderLogin(msg) {
  closeDrawer();
  $('root').innerHTML = `<div class="login"><form class="card" id="lf" autocomplete="on">
    <div class="brand" style="padding:0"><div class="logo">А</div><div><b>АдалинКонсалт</b><span>CRM</span></div></div>
    <h1>Вход в систему</h1><div class="muted small">Для сотрудников и клиентов компании</div>
    <label for="lg">Логин</label><input type="text" id="lg" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    <label for="pw">Пароль</label><input type="password" id="pw" autocomplete="current-password" required>
    <button class="btn" id="lb">Войти</button>
    <div class="err" id="le">${esc(msg || '')}</div>
    <div class="muted small" style="margin-top:6px">Логин и временный пароль выдаёт руководитель. Забыли пароль — обратитесь к нему, он выдаст новый.</div>
  </form></div>`;
  $('lg').focus();
  $('lf').onsubmit = async e => {
    e.preventDefault();
    $('lb').disabled = true; $('le').textContent = '';
    try {
      const j = await call('login', { login: $('lg').value, password: $('pw').value });
      S.token = j.token; store.set('adalin_token', j.token);
      if (j.mustChange) renderPassword(true); else await start();
    } catch (err) { $('le').textContent = err.message; $('lb').disabled = false; }
  };
}
function renderPassword(first) {
  const html = `<form class="card" id="pf">
    <div class="brand" style="padding:0"><div class="logo">А</div><div><b>АдалинКонсалт</b><span>CRM</span></div></div>
    <h1>${first ? 'Придумайте свой пароль' : 'Смена пароля'}</h1>
    <div class="muted small">${first ? 'Временный пароль больше не понадобится. ' : ''}Не короче 8 символов, буквы и цифры.</div>
    ${first ? '' : '<label>Текущий пароль</label><input type="password" id="po" autocomplete="current-password" required>'}
    <label>Новый пароль</label><input type="password" id="p1" autocomplete="new-password" required>
    <label>Повторите новый пароль</label><input type="password" id="p2" autocomplete="new-password" required>
    <button class="btn" id="pb">Сохранить пароль</button>
    ${first ? '' : '<button type="button" class="btn ghost" id="pc" style="margin-top:8px">Отмена</button>'}
    <div class="err" id="pe"></div></form>`;
  if (first) { $('root').innerHTML = '<div class="login">' + html + '</div>'; }
  else openModal(html.replace('class="card"', 'class=""'));
  if ($('pc')) $('pc').onclick = closeModal;
  $('pf').onsubmit = async e => {
    e.preventDefault();
    if ($('p1').value !== $('p2').value) { $('pe').textContent = 'Пароли не совпадают.'; return; }
    $('pb').disabled = true;
    try {
      await call('password.change', { password: $('p1').value, old: $('po') ? $('po').value : '' });
      closeModal(); toast('Пароль изменён'); if (first) await start();
    } catch (err) { $('pe').textContent = err.message; $('pb').disabled = false; }
  };
}

// ===================== запуск =====================
async function start() {
  if (!tg && !S.token) return renderLogin();
  $('root').innerHTML = '<div class="loading">Загрузка…</div>';
  try {
    const j = await call('me');
    if (j.mustChange) return renderPassword(true);
    S.data = j; render();
  } catch (e) {
    if (e.auth) renderLogin(e.message);
    else $('root').innerHTML = `<div class="login"><div class="card"><b>Не удалось загрузить данные</b><p class="muted">${esc(e.message)}</p><button class="btn" onclick="location.reload()">Обновить</button></div></div>`;
  }
}

// ===================== меню по ролям =====================
function navFor(d) {
  const openReq = (d.requests || []).length;
  const over = (d.tasks || []).filter(t => t.overdue).length;
  if (d.role === 'клиент') return [
    { sec: null, items: [['deadlines', 'Сроки платежей'], ['need', 'Что нужно от вас', d.requests.length], ['reports', 'Отчёты']] }];
  if (d.role === 'сотрудник') return [
    { sec: null, items: [['tasks', 'Мои задачи', over], ['requests', 'Запросы клиентам', openReq], ['clients', 'Мои клиенты'], ['time', 'Моё время']] },
    { sec: 'Справочники', items: [['regs', 'Регламенты']] }];
  return [
    { sec: null, items: [['dash', 'Аналитика'], ['leads', 'Заявки', null, 'этап 4'], ['clients', 'Клиенты'], ['tasks', 'Задачи', over], ['requests', 'Запросы клиентам', openReq], ['reports', 'Отчёты', (d.reports || []).filter(r => r.status === 'черновик').length]] },
    { sec: 'Управление', items: [['time', 'Рабочее время'], ['users', 'Сотрудники и доступы'], ['regs', 'Регламенты']] }];
}
const TITLES = { dash: 'Аналитика', leads: 'Заявки', clients: 'Клиенты', tasks: 'Задачи', requests: 'Запросы клиентам', reports: 'Отчёты',
  users: 'Сотрудники и доступы', regs: 'Регламенты', deadlines: 'Сроки платежей', need: 'Что нужно от вас', time: 'Рабочее время' };

function render() {
  const d = S.data; if (!d) return;
  const groups = navFor(d);
  const all = groups.flatMap(g => g.items).filter(i => !i[3]);

  const shownName = d.role === 'клиент' ? d.clientName : (d.role === 'руководитель' ? d.me : d.name);
  const navHtml = groups.map(g => (g.sec ? `<div class="nav-sec">${esc(g.sec)}</div>` : '') + g.items.map(i =>
    `<button data-v="${i[0]}" class="${i[0] === S.view ? 'on' : ''}" ${i[3] ? 'disabled' : ''}><span>${esc(i[1])}</span>${i[3] ? `<span class="soon">${esc(i[3])}</span>` : (i[2] ? `<span class="cnt">${i[2]}</span>` : '')}</button>`).join('')).join('');

      <optgroup label="Клиент">${(d.clients || []).map(c => `<option value="клиент|${esc(c.code)}" ${cur === 'клиент|' + c.code ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</optgroup></select>`;
  }
  $('root').innerHTML = `<div class="app">
    <aside class="side">
      <div class="brand"><div class="logo">А</div><div><b>АдалинКонсалт</b><span>CRM</span></div></div>
      <nav class="nav" id="nav">${navHtml}</nav>
      <div class="side-foot">
        <div class="who"><div class="ava">${esc(String(shownName || roleLbl).charAt(0))}</div><div><b>${esc(shownName || roleLbl)}</b><span>${esc(roleLbl)}${d.viaManager ? ' · просмотр' : ''}</span></div></div>
        ${asSel}
        ${d.sheetUrl && !d.viaManager ? `<a class="linkbtn" href="${esc(d.sheetUrl)}" target="_blank" rel="noopener">Таблица</a>` : ''}
        ${S.token ? '<button class="linkbtn" id="chpw">Сменить пароль</button><button class="linkbtn" id="logout">Выйти</button>' : ''}
      </div>
    </aside>
    <div class="main">
      <div class="mnav" id="mnav">${all.map(i => `<button data-v="${i[0]}" class="${i[0] === S.view ? 'on' : ''}">${esc(i[1])}${i[2] ? ' · ' + i[2] : ''}</button>`).join('')}</div>
      <div class="top"><h2>${esc(TITLES[S.view] || '')}</h2><div class="right">${d.test ? '<span class="pill warn">тестовый режим</span>' : ''}<span>${esc(longDate(d.today))}</span></div></div>
      ${d.test && d.role !== 'клиент' ? '<div class="testbar">Тестовый режим: всё, что адресовано клиентам и сотрудникам, приходит только руководителю с пометкой [ТЕСТ].</div>' : ''}
      ${d.viaManager ? `<div class="viewbar">Вы смотрите глазами: ${esc(d.role === 'клиент' ? 'клиент ' + d.clientName : 'сотрудник ' + d.name)}. Изменения сохраняются по-настоящему.</div>` : ''}
      ${d.running ? timerBar(d.running) : ''}
      <div class="content" id="content"></div>
    </div></div>`;
  document.querySelectorAll('#nav button, #mnav button').forEach(b => b.onclick = () => { if (b.disabled) return; S.view = b.dataset.v; S.drawer = null; location.hash = S.view; render(); window.scrollTo(0, 0); });
  if ($('asSel')) $('asSel').onchange = e => {
    const v = e.target.value;
    if (!v) S.as = null; else { const [role, x] = v.split('|'); S.as = role === 'клиент' ? { role, code: x } : { role, name: x }; }
    S.view = null; S.f = { q: '', emp: '', client: '', period: '', st: 'open' }; closeDrawer();
    $('content').innerHTML = '<div class="loading">Загрузка…</div>'; act('me');
  };
  if ($('logout')) $('logout').onclick = async () => { try { await call('logout'); } catch (e) { /* уже вышли */ } logoutLocal(); renderLogin(); };
  if ($('chpw')) $('chpw').onclick = () => renderPassword(false);
  if ($('tbStop')) $('tbStop').onclick = async () => { const r = await act('time.stop', {}, $('tbStop')); if (r) toast(r.timer.stoppedMin ? 'Записано: ' + fmtMin(r.timer.stoppedMin) : 'Меньше минуты — не записано'); };
  if ($('tbOpen')) $('tbOpen').onclick = () => openTask(d.running.taskId);
  ({ dash: vDash, clients: vClients, tasks: vTasks, requests: vRequests, users: vUsers, regs: vRegs, time: vTime,
     deadlines: vDeadlines, need: vNeed, reports: vReports })[S.view]();
  if (S.drawer) S.drawer();
}
function longDate(s) {
  const d = parseD(s); if (!d) return s || '';
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }).replace(' г.', '');
}

// ===================== общие помощники задач =====================
const isDone = t => low(t['Статус']) === 'выполнено';
const isWait = t => low(t['Статус']) === 'ожидает клиента';
function badge(t) {
  if (t.overdue) return '<span class="badge b-over">просрочено</span>';
  if (isDone(t)) return '<span class="badge b-done">выполнено</span>';
  if (isWait(t)) return '<span class="badge b-wait">ждём клиента</span>';
  if (low(t['Статус']) === 'в работе') return '<span class="badge b-work">в работе</span>';
  return '<span class="badge">' + esc(t['Статус'] || 'к выполнению') + '</span>';
}
function sumText(t) {
  if (t.kind === 'zp') return t['Сумма к выплате'] !== '' ? money(t['Сумма к выплате']) : '—';
  if (t.kind === 'tax' || t.kind === 'avans') return t['Сумма'] !== '' ? money(t['Сумма']) : '—';
  return '';
}
function needsSum(t) {
  if (isDone(t) && t.kind === 'none') return false;
  if (t.kind === 'zp') return t['Сумма к выплате'] === '' || t['Подоходный'] === '' || t['ФСЗН'] === '';
  if (t.kind === 'tax' || t.kind === 'avans') return t['Сумма'] === '';
  return false;
}
function daysTo(s) { const d = parseD(s), t = parseD(S.data.today); return d && t ? Math.round((d - t) / 864e5) : null; }
function periods() { return [...new Set((S.data.tasks || []).map(t => t.period).filter(Boolean))]; }
function taskRows(list, opts = {}) {
  const mgr = S.data.role === 'руководитель';
  if (!list.length) return '<div class="empty">Задач нет</div>';
  return `<table class="tbl"><thead><tr>${opts.noClient ? '' : '<th>Клиент</th>'}<th>Задача</th><th>Срок</th><th class="num">Сумма, BYN</th><th class="num">Время</th>${mgr ? '<th>Сотрудник</th>' : ''}<th>Статус</th></tr></thead><tbody>` +
    list.map(t => `<tr class="click" data-task="${esc(t.id)}">
      ${opts.noClient ? '' : `<td class="nm" data-l="Клиент"><b>${esc(t.client)}</b></td>`}
      <td>${esc(t.title)}<div class="sub">${esc(t.period)}${t.type === 'разовая' ? ' · разовая' : ''}${t.request ? ' · запрос клиенту от ' + esc(t.request.date) : ''}</div></td>
      <td data-l="Срок">${esc(t.deadline)}${t.payDate && t.payDate !== t.deadline ? `<div class="sub">уплата ${esc(t.payDate)}</div>` : ''}</td>
      <td class="num" data-l="Сумма">${sumText(t) || ''}</td>
      <td class="num" data-l="Время">${timeCell(t)}</td>
      ${mgr ? `<td data-l="Сотрудник">${esc(t.employee)}</td>` : ''}
      <td>${badge(t)}</td></tr>`).join('') + '</tbody></table>';
}
function bindTaskRows(root) { root.querySelectorAll('[data-task]').forEach(r => r.onclick = () => openTask(r.dataset.task)); }

// ===================== АНАЛИТИКА (руководитель) =====================
function vDash() {
  const d = S.data, T = d.tasks, C = d.clientCards;
  const active = C.filter(c => low(c['Статус']) === 'активный');
  const feeField = (d.moneyFields || []).find(f => /абонент/i.test(f));
  const mrr = feeField ? active.reduce((a, c) => a + (Number(c[feeField]) || 0), 0) : 0;
  const open = T.filter(t => !isDone(t)), over = T.filter(t => t.overdue), wait = T.filter(isWait);
  const esc2 = d.requests.filter(r => r.escalated);
  const noSum = open.filter(t => needsSum(t) && t.payDate && daysTo(t.payDate) !== null && daysTo(t.payDate) >= 0 && daysTo(t.payDate) <= 3);
  const badCards = C.filter(c => /неполная/.test(c['Карточка'] || ''));
  const noTg = active.filter(c => c['Telegram chat_id'] !== 'подключён');
  const per = S.progPeriod && periods().includes(S.progPeriod) ? S.progPeriod : d.defaultPeriod;
  const perTasks = T.filter(t => t.period === per);
  const doneP = perTasks.filter(isDone).length;
  const attn = [
    ['#b42318', 'Просроченные задачи', 'срок прошёл, задача не закрыта', over.length, () => { S.f = { ...S.f, st: 'over', emp: '', client: '' }; go('tasks'); }],
    ['#b42318', 'Клиент молчит — вопрос у вас', 'нет ответа и на повторный запрос', esc2.length, () => go('requests')],
    ['#b42318', 'Нет суммы, а срок уплаты в ближайшие 3 дня', 'клиенту напоминание не уйдёт', noSum.length, () => { S.f = { ...S.f, st: 'nosum', emp: '', client: '' }; go('tasks'); }],
    ['#b54708', 'Ждём информацию от клиента', 'открытые запросы клиентам', wait.length, () => go('requests')],
    ['#b54708', 'Неполные карточки клиентов', 'по ним не создаются задачи', badCards.length, () => go('clients')],
  ];
  const emps = [...new Set(T.map(t => t.employee).filter(Boolean))];
  $('content').innerHTML = `
    <div class="over">Управленческий обзор</div>
    <h1 class="hero">Всё важное — до того, как станет срочным.</h1>
    <p class="lead">Задачи сотрудников, запросы клиентам и сроки — на одном экране. Данные из таблицы CRM на ${esc(d.today)}.</p>
    <div class="kpis">
      <div class="panel kpi"><div class="l">Активные клиенты</div><div class="v">${active.length}</div><div class="s">всего в базе ${C.length}</div></div>
      <div class="panel kpi"><div class="l">Абонентская плата в месяц</div><div class="v">${mrr ? money(mrr).replace(/,00$/, '') : '—'}</div><div class="s">${mrr ? 'BYN, активные клиенты' : 'заполните в карточках'}</div></div>
      <div class="panel kpi"><div class="l">Открытые задачи</div><div class="v">${open.length}</div><div class="s">у ${emps.length} сотр.</div></div>
      <div class="panel kpi ${over.length ? 'red' : ''}"><div class="l">Просрочено</div><div class="v">${over.length}</div><div class="s">задач</div></div>
      <div class="panel kpi ${wait.length ? 'amber' : ''}"><div class="l">Ждём клиента</div><div class="v">${wait.length}</div><div class="s">задач стоит</div></div>
    </div>
    <div class="minis">
      <div class="panel mini"><div class="l">Выполнено за ${esc(per)}</div><div class="v">${doneP} из ${perTasks.length}</div></div>
      <div class="panel mini"><div class="l">Открытые запросы клиентам</div><div class="v">${d.requests.length}</div></div>
      <div class="panel mini"><div class="l">Вопросы у вас</div><div class="v">${esc2.length}</div></div>
      <div class="panel mini"><div class="l">Неполные карточки</div><div class="v">${badCards.length}</div></div>
      <div class="panel mini"><div class="l">Клиенты без Telegram</div><div class="v">${noTg.length}</div></div>
    </div>
    <div class="cols">
      <div class="panel pad"><div class="ph"><h3>Требуют внимания</h3><span>нажмите строку, чтобы открыть список</span></div>
        <ul class="attn">${attn.map((a, i) => `<li data-a="${i}"><span class="dot" style="background:${a[3] ? a[0] : '#c9ccc4'}"></span><span class="t">${esc(a[1])}<small>${esc(a[2])}</small></span><span class="n">${a[3]}</span></li>`).join('')}</ul></div>
      <div class="panel pad"><div class="ph"><h3>Загрузка сотрудников</h3><span>задачи за 60 дней</span></div>
        ${emps.length ? `<table class="tbl" style="margin-top:6px"><thead><tr><th>Сотрудник</th><th class="num">Открыто</th><th class="num">Просрочено</th><th class="num">Ждём клиента</th><th class="num">Выполнено</th></tr></thead><tbody>
        ${emps.map(e => { const m = T.filter(t => t.employee === e); return `<tr class="click" data-emp="${esc(e)}"><td><b>${esc(e)}</b></td><td class="num" data-l="Открыто">${m.filter(t => !isDone(t)).length}</td><td class="num" data-l="Просрочено">${m.filter(t => t.overdue).length || '—'}</td><td class="num" data-l="Ждём клиента">${m.filter(isWait).length || '—'}</td><td class="num" data-l="Выполнено">${m.filter(isDone).length}</td></tr>`; }).join('')}</tbody></table>` : '<div class="empty">Задач пока нет</div>'}
      </div>
    </div>
    <div class="panel pad">
      <div class="ph"><h3>Готовность отчётов клиентам</h3>
        <select id="progSel">${[...new Set([d.defaultPeriod, ...periods()])].map(p => `<option ${p === per ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select></div>
      <div class="muted small" style="margin-bottom:8px">Выполненные задачи за отчётный период по каждому клиенту. Когда всё выполнено, черновик отчёта собирается сам — см. «Отчёты».</div>
      ${C.map(c => { const m = perTasks.filter(t => t.clientCode === c['Код']); if (!m.length) return ''; const dn = m.filter(isDone).length; const pct = Math.round(dn / m.length * 100);
        return `<div class="prog" data-cl="${esc(c['Код'])}"><div><b>${esc(c['Клиент'])}</b><div class="sub muted small">${esc(c['Ответственный'])}</div></div><div class="bar"><i style="width:${pct}%;${pct === 100 ? 'background:#1e7a4c' : ''}"></i></div><div class="r">${dn} из ${m.length}</div></div>`; }).join('') || '<div class="empty">Задач за этот период нет</div>'}
    </div>`;
  $('content').querySelectorAll('[data-a]').forEach(li => li.onclick = attn[li.dataset.a][4]);
  $('content').querySelectorAll('[data-emp]').forEach(r => r.onclick = () => { S.f = { ...S.f, emp: r.dataset.emp, st: 'open', client: '' }; go('tasks'); });
  $('content').querySelectorAll('[data-cl]').forEach(r => r.onclick = () => openClient(r.dataset.cl));
  $('progSel').onchange = e => { S.progPeriod = e.target.value; vDash(); };
}
function go(view) { S.view = view; S.drawer = null; closeDrawer(); location.hash = view; render(); window.scrollTo(0, 0); }

// ===================== ЗАДАЧИ =====================
function vTasks() {
  const d = S.data, mgr = d.role === 'руководитель', f = S.f;
  let list = d.tasks.slice();
  if (f.emp) list = list.filter(t => t.employee === f.emp);
  if (f.client) list = list.filter(t => t.clientCode === f.client);
  if (f.period) list = list.filter(t => t.period === f.period);
  if (f.q) { const q = low(f.q); list = list.filter(t => low(t.title + ' ' + t.client).includes(q)); }
  const counts = { open: list.filter(t => !isDone(t)).length, over: list.filter(t => t.overdue).length, wait: list.filter(isWait).length, nosum: list.filter(t => !isDone(t) && needsSum(t)).length, done: list.filter(isDone).length, all: list.length };
  const byStatus = { open: t => !isDone(t), over: t => t.overdue, wait: isWait, nosum: t => !isDone(t) && needsSum(t), done: isDone, all: () => true };
  list = list.filter(byStatus[f.st] || byStatus.open);
  const clientsOpt = mgr ? d.clients : d.clientCards.map(c => ({ code: c['Код'], name: c['Клиент'] }));
  $('content').innerHTML = `
    <div class="toolbar">
      <input type="text" id="fq" placeholder="Поиск по задаче или клиенту" value="${esc(f.q)}" style="width:240px">
      ${mgr ? `<select id="femp"><option value="">Все сотрудники</option>${d.employees.map(e => `<option ${e === f.emp ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select>` : ''}
      <select id="fcl"><option value="">Все клиенты</option>${clientsOpt.map(c => `<option value="${esc(c.code)}" ${c.code === f.client ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
      <select id="fper"><option value="">Все периоды</option>${periods().map(p => `<option ${p === f.period ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select>
      <span class="grow"></span>
      <button class="btn" id="newTask">+ Разовая задача</button>
    </div>
    <div class="toolbar"><div class="chips" id="fst">${[['open', 'Открытые'], ['over', 'Просрочено'], ['wait', 'Ждём клиента'], ['nosum', 'Нет суммы'], ['done', 'Выполнено'], ['all', 'Все']]
      .map(c => `<button data-s="${c[0]}" class="${c[0] === f.st ? 'on' : ''}">${c[1]} ${counts[c[0]]}</button>`).join('')}</div></div>
    <div class="panel">${taskRows(list)}</div>
    ${!mgr ? '<p class="muted small">Здесь только ваши задачи. Выполненные показываются за последние 60 дней.</p>' : ''}`;
  $('fq').oninput = e => { S.f.q = e.target.value; const pos = e.target.selectionStart; vTasks(); $('fq').focus(); $('fq').setSelectionRange(pos, pos); };
  if ($('femp')) $('femp').onchange = e => { S.f.emp = e.target.value; vTasks(); };
  $('fcl').onchange = e => { S.f.client = e.target.value; vTasks(); };
  $('fper').onchange = e => { S.f.period = e.target.value; vTasks(); };

  showDrawer(`<div class="dh"><div><h3>${esc(t.title)}</h3><div class="muted small">${esc(t.client)} · отчётный период: ${esc(t.period)}${t.type === 'разовая' ? ' · разовая' : ''}</div>
      <div class="muted small">Срок задачи ${esc(t.deadline)}${t.payDate ? ' · срок уплаты ' + esc(t.payDate) : ''} · ${esc(t.employee)}</div></div><button class="x" id="dx" aria-label="Закрыть">×</button></div>
    <div class="db">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${badge(t)}${t.closed ? `<span class="muted small">закрыта ${esc(t.closed)}</span>` : ''}<span class="grow" style="flex:1"></span>

      <label>Статус</label><div class="chips" id="seg">${['к выполнению', 'в работе', 'выполнено'].map(s => `<button type="button" data-s="${s}" class="${s === st ? 'on' : ''}">${s}</button>`).join('')}${st === 'ожидает клиента' ? '<button type="button" class="on" data-s="ожидает клиента">ждём клиента</button>' : ''}</div>

function clientStats(code) {
  const m = S.data.tasks.filter(t => t.clientCode === code);
  return { all: m.length, done: m.filter(isDone).length, work: m.filter(t => low(t['Статус']) === 'в работе').length,
    todo: m.filter(t => !isDone(t) && low(t['Статус']) !== 'в работе' && !isWait(t)).length, over: m.filter(t => t.overdue).length, wait: m.filter(isWait).length };
}
function vClients() {
  const d = S.data, mgr = d.role === 'руководитель';
  const fee = (d.moneyFields || []).find(f => /абонент/i.test(f));

    ${list.map(c => { const s = clientStats(c['Код']); return `<tr class="click" data-cl="${esc(c['Код'])}"><td class="nm"><b>${esc(c['Клиент'])}</b><div class="sub">${esc(c['Код'])} · ${esc(c['Статус'])}</div></td>
      <td data-l="Тип, режим">${esc(c['Тип'])}, ${esc(c['Режим'])}</td>${mgr ? `<td data-l="Ответственный">${esc(c['Ответственный'])}</td>` : ''}
      <td class="num" data-l="Открыто">${s.all - s.done}</td><td class="num" data-l="Просрочено">${s.over ? `<span class="badge b-over">${s.over}</span>` : '—'}</td><td class="num" data-l="Ждём клиента">${s.wait ? `<span class="badge b-wait">${s.wait}</span>` : '—'}</td>
      <td data-l="Telegram">${c['Telegram chat_id'] === 'подключён' ? '<span class="badge b-done">подключён</span>' : '<span class="badge">нет</span>'}</td>
      <td data-l="Карточка">${/неполная/.test(c['Карточка'] || '') ? '<span class="badge b-wait">неполная</span>' : '<span class="badge b-done">полная</span>'}</td>
      ${fee ? `<td class="num" data-l="Абон. плата">${money(c[fee]) || '—'}</td>` : ''}</tr>`; }).join('')}</tbody></table>` : '<div class="empty">Клиентов нет</div>'}</div>
    ${!mgr ? '<p class="muted small">Здесь только клиенты, за которых вы отвечаете.</p>' : ''}`;
  $('cq').oninput = e => { S.f.cq = e.target.value; const p = e.target.selectionStart; vClients(); $('cq').focus(); $('cq').setSelectionRange(p, p); };
  if ($('newCl')) $('newCl').onclick = () => editClient(null);

const CARD_GROUPS = [
  ['Основное', ['Клиент', 'Код', 'Тип', 'Режим', 'Статус', 'Обслуживаем с', 'Ответственный']],
  ['Налоги и зарплата', ['Плательщик НДС', 'Период НДС', 'Есть работники', 'День выплаты ЗП', 'День выплаты аванса', 'Импорт ЕАЭС', 'Недвижимость', 'Транспорт']],
  ['Платёжки и связь', ['Платёжки по зарплате', 'Платёжки по налогам', 'Имя контактного лица', 'Telegram chat_id']],
];
function openClient(code, tab) {
  const d = S.data, c = d.clientCards.find(x => x['Код'] === code);
  if (!c) return;
  tab = tab || 'card';
  const mgr = d.role === 'руководитель', s = clientStats(code);
  const tasks = d.tasks.filter(t => t.clientCode === code);
  const known = CARD_GROUPS.flatMap(g => g[1]);
  const rest = Object.keys(c).filter(k => !known.includes(k) && k !== 'Карточка');
  const groups = CARD_GROUPS.concat(rest.length ? [['Прочее', rest]] : []);
  const cardHtml = groups.map(g => `<h4 style="margin:14px 0 6px">${esc(g[0])}</h4><div class="kv">${g[1].filter(k => k in c).map(k => `<div>${esc(k)}</div><div>${esc(k === 'Telegram chat_id' ? c[k] : (c[k] === '' ? '—' : (/BYN/.test(k) ? money(c[k]) : c[k])))}</div>`).join('')}</div>`).join('') +
    (/неполная/.test(c['Карточка'] || '') ? `<div class="note" style="margin-top:14px">Карточка ${esc(c['Карточка'])}. Пока она неполная, задачи и напоминания по клиенту не создаются.</div>` : '');
  const ruleCodes = [...new Set(tasks.map(t => t.rule).filter(Boolean))];
  const regs = d.regs.filter(g => g.rules.some(r => ruleCodes.includes(r)));
  const regHtml = regs.length ? `<ul class="attn">${regs.map(g => `<li data-reg="${esc(g.code)}"><span class="dot" style="background:${String(g.steps || '').trim() ? '#27466e' : '#c9ccc4'}"></span><span class="t">${esc(g.name)}<small>${esc(g.category || '')}${String(g.steps || '').trim() ? '' : ' · шаги не заполнены'}</small></span></li>`).join('')}</ul>` : '<div class="empty">По задачам клиента регламенты не привязаны</div>';
  showDrawer(`<div class="dh"><div><h3>${esc(c['Клиент'])}</h3><div class="muted small">${esc(c['Код'])} · ${esc(c['Тип'])}, ${esc(c['Режим'])} · ${esc(c['Статус'])} · ${esc(c['Ответственный'])}</div></div><button class="x" id="dx">×</button></div>
    <div class="db">
      <div class="stats"><div><b>${s.all}</b><span>всего задач</span></div><div><b>${s.done}</b><span>выполнено</span></div><div><b>${s.work}</b><span>в работе</span></div><div><b>${s.todo}</b><span>к выполнению</span></div><div><b style="color:${s.over ? '#b42318' : 'inherit'}">${s.over}</b><span>просрочено</span></div><div><b style="color:${s.wait ? '#9a5b00' : 'inherit'}">${s.wait}</b><span>ждём клиента</span></div></div>
      <div class="actions" style="margin:0 0 12px"><button class="btn ghost sm" id="cNewTask">Создать задачу</button>${mgr ? '<button class="btn ghost sm" id="cEdit">Редактировать карточку</button>' : ''}</div>
      <div class="tabs2" id="ctabs">${[['card', 'Карточка'], ['tasks', 'Задачи (' + tasks.length + ')'], ['regs', 'Регламенты услуг']].map(x => `<button data-t="${x[0]}" class="${x[0] === tab ? 'on' : ''}">${x[1]}</button>`).join('')}</div>
      <div id="ctab">${tab === 'card' ? cardHtml : tab === 'tasks' ? `<div class="panel">${taskRows(tasks, { noClient: true })}</div>` : regHtml}</div>
    </div>`, () => openClient(code, tab), true);
  $('dx').onclick = closeDrawer;
  $('ctabs').onclick = e => { const b = e.target.closest('button'); if (b) openClient(code, b.dataset.t); };
  $('cNewTask').onclick = () => openNewTask(code);
  if ($('cEdit')) $('cEdit').onclick = () => editClient(code);
  bindTaskRows($('ctab'));
  $('ctab').querySelectorAll('[data-reg]').forEach(li => li.onclick = () => showReg(d.regs.find(g => g.code === li.dataset.reg)));
}
function editClient(code) {
  const d = S.data, c = code ? d.clientCards.find(x => x['Код'] === code) : {};
  const fields = d.clientFields.filter(f => !f.readonly);
  const input = f => {
    const v = c[f.name] === undefined ? '' : c[f.name];
    if (f.options) return `<select data-cf="${esc(f.name)}"><option value=""></option>${f.options.map(o => `<option ${String(o) === String(v) ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    return `<input type="text" data-cf="${esc(f.name)}" value="${esc(f.number && v !== '' && /BYN/.test(f.name) ? money(v) : v)}" ${f.date ? 'placeholder="ДД.ММ.ГГГГ"' : ''}>`;

}

function inPeriod(dateStr, per) {

  if (per === 'week') { const mon = new Date(t); mon.setDate(t.getDate() - ((t.getDay() + 6) % 7)); return d >= mon && d <= t; }

  if (per === 'prev') { const p = new Date(t.getFullYear(), t.getMonth() - 1, 1); return d.getFullYear() === p.getFullYear() && d.getMonth() === p.getMonth(); }
  return true;
}

  const perLbl = { today: 'сегодня', week: 'эта неделя', month: monthName(t), prev: monthName(new Date(t.getFullYear(), t.getMonth() - 1, 1)), all: 'всё время' };

async function openReport(id) {

        ${draft ? `<button class="btn" id="rap">${rp.complete || !before28 ? 'Утвердить и отправить клиенту' : 'Утвердить — уйдёт 28-го'}</button>` : ''}
        ${rp.status === 'утверждён' ? '<button class="btn ghost" id="run">Вернуть в черновик</button>' : ''}

  };

async function downloadReport(id, btn) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = 'Готовлю PDF…';
  try {
    const j = await call('report.pdf', { id });
    const bin = atob(j.pdf.base64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
    const a = document.createElement('a'); a.href = url; a.download = j.pdf.ascii || j.pdf.name; /* латиница — имя файла сохраняется во всех браузерах */ a.style.display = 'none'; document.body.appendChild(a); a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 10000);
  } catch (e) { toast(e.message, true); }
  finally { btn.disabled = false; btn.textContent = old; }
}

  $('content').querySelectorAll('[data-pdf]').forEach(b => b.onclick = () => downloadReport(b.dataset.pdf, b));
  $('content').querySelectorAll('[data-open]').forEach(b => b.onclick = async () => {
    try { const j = await call('report.view', { id: b.dataset.open }); showDrawer(`<div class="dh"><div><h3>Отчёт</h3></div><button class="x" id="dx">×</button></div><div class="db"><div class="actions" style="margin-top:0"><button class="btn" id="rpdf">Скачать PDF</button></div><div class="panel pad" style="margin-top:14px">${j.report.html}</div></div>`, null, true);
      $('dx').onclick = closeDrawer; $('rpdf').onclick = () => downloadReport(b.dataset.open, $('rpdf')); } catch (e) { toast(e.message, true); }
  });
}

// ===================== боковая панель и окна =====================
function showDrawer(html, rerender, wide) {
  const dr = $('drawer'); dr.innerHTML = html; dr.classList.toggle('wide', !!wide);
  dr.classList.add('open'); $('shade').classList.add('open');
  S.drawer = rerender || null;
}
function closeDrawer() { const dr = $('drawer'); if (!dr) return; dr.classList.remove('open'); $('shade').classList.remove('open'); S.drawer = null; }
$('shade').onclick = closeDrawer;
function openModal(html) { $('modalWrap').innerHTML = `<div class="modal-shade" id="mshade"></div><div class="modal" role="dialog">${html}</div>`; $('mshade').onclick = closeModal; }
function closeModal() { $('modalWrap').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('modalWrap').innerHTML) closeModal(); else closeDrawer(); } });
if (location.hash) S.view = location.hash.slice(1);

start();

</script>
