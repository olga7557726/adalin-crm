:root {
  --blue: #165B78; --ink: #172A33; --white: #F7FAFA; --mist: #E7F1F3; --aqua: #A9CFCE; --warm: #D49A55;
  --bg: var(--white); --panel: #ffffff; --line: #D6E7E8; --line2: var(--aqua);
  --text: var(--ink); --muted: #566B74; --muted2: #86989F;
  --accent: var(--blue); --accent-2: #0F4760; --accent-weak: var(--mist);
  --hover: #EEF5F6; --soft: #F3F8F9; --track: #E1EDEF;
  --danger: #b42318; --danger-weak: #fdecea; --warn: #9a5b00; --warn-weak: #fdf3dc;
  --ok: #1e7a4c; --ok-weak: #e5f4ec; --radius: 16px;
  --head: "Onest", "Golos Text", "Segoe UI", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 "Golos Text", "Segoe UI", Roboto, Arial, sans-serif; }
h1, h2, h3, h4, .kpi .v, .mini .v, .stats b, .brand b, .over, .nav-sec, .reglist .grp { font-family: var(--head); font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.hidden { display: none !important; }

/* ---------- каркас ---------- */
.app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; }
.logo { width: 42px; height: auto; display: block; flex: none; }
.brand b { display: block; font-size: 15px; color: var(--accent); letter-spacing: .01em; } .brand span { font-size: 12px; color: var(--muted); }
.nav { padding: 6px 10px; overflow-y: auto; flex: 1; }
.nav-sec { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted2); margin: 14px 10px 6px; }
.nav button { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px; border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--text); }
.nav button:hover { background: var(--hover); }
.nav button.on { background: var(--accent-weak); color: var(--accent); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
.nav button[disabled] { color: var(--muted2); cursor: default; background: none; }
.nav .cnt { font-size: 11px; background: var(--danger-weak); color: var(--danger); border-radius: 10px; padding: 1px 7px; font-weight: 600; }
.nav .soon { font-size: 10px; color: var(--muted2); border: 1px solid var(--line); border-radius: 8px; padding: 0 6px; }
.side-foot { border-top: 1px solid var(--line); padding: 12px 14px; font-size: 13px; }
.who { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.ava { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-weak); color: var(--accent); display: grid; place-items: center; font-weight: 700; flex: none; }
.who b { display: block; } .who span { color: var(--muted); font-size: 12px; }
.side-foot select { width: 100%; margin: 4px 0 8px; }
.linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 2px 0; margin-right: 12px; font-size: 13px; }
.main { min-width: 0; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 28px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 4; }
.top h2 { margin: 0; font-size: 17px; }
.top .right { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 13px; }
.pill { font-size: 12px; border-radius: 12px; padding: 2px 10px; border: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
.pill.warn { background: var(--warn-weak); color: var(--warn); border-color: #f1dfb2; }
.content { padding: 22px 28px 60px; max-width: 1320px; }
.testbar { background: var(--warn-weak); color: var(--warn); font-size: 12px; padding: 6px 28px; border-bottom: 1px solid #f1dfb2; }
.viewbar { background: var(--accent-weak); color: var(--accent); font-size: 12px; padding: 6px 28px; }

/* ---------- элементы ---------- */
.over { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 8px; }
.over::before { content: ""; width: 22px; height: 2px; background: var(--warm); }
h1.hero { font-size: 26px; margin: 6px 0 4px; letter-spacing: -.01em; }
.lead { color: var(--muted); margin: 0 0 18px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.pad { padding: 16px 18px; }
.kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 12px; }
.kpi { padding: 14px 16px; }
.kpi .l { font-size: 12px; color: var(--muted); } .kpi .v { font-size: 26px; margin-top: 4px; letter-spacing: -.01em; }
.kpi .s { font-size: 12px; color: var(--muted2); margin-top: 2px; }
.kpi.red .v { color: var(--danger); } .kpi.amber .v { color: var(--warn); }
.minis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 18px; }
.mini { padding: 10px 14px; } .mini .l { font-size: 12px; color: var(--muted); } .mini .v { font-size: 18px; font-weight: 600; }
.cols { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; margin-bottom: 16px; }
.stack { display: grid; gap: 16px; margin-bottom: 16px; }
.cols > .panel, .stack > .panel { min-width: 0; overflow-x: auto; }
.ph { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.ph h3 { margin: 0; font-size: 15px; } .ph span { color: var(--muted); font-size: 12px; }
.attn { list-style: none; margin: 8px 0 0; padding: 0; }
.attn li { display: flex; align-items: center; gap: 10px; padding: 11px 4px; border-top: 1px solid var(--line); cursor: pointer; }
.attn li:hover { background: var(--soft); }
.attn .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.attn .t { flex: 1; } .attn .t small { display: block; color: var(--muted); font-size: 12px; }
.attn .n { font-weight: 650; font-size: 16px; }
.bar { height: 8px; background: var(--track); border-radius: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.prog { display: grid; grid-template-columns: 1.3fr 2fr 70px; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; }
.prog:first-of-type { border-top: 0; }
.prog .r { text-align: right; color: var(--muted); font-size: 13px; }

table.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--soft); }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: var(--soft); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl th.sel, .tbl td.sel { width: 34px; padding-right: 0; } .tbl td.sel input, .tbl th.sel input { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }
.bulkbar { background: var(--accent-weak); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.bulkbar[hidden] { display: none; }
.tbl .sub { color: var(--muted); font-size: 12px; }
.tbl .num { text-align: right; white-space: nowrap; }
.tbl td.nm { min-width: 150px; }
.twrap { overflow-x: auto; }
.acts { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; min-width: 190px; }
.badge { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 10px; background: var(--track); color: var(--muted); white-space: nowrap; }
.b-over { background: var(--danger-weak); color: var(--danger); } .b-wait { background: var(--warn-weak); color: var(--warn); }
.b-done { background: var(--ok-weak); color: var(--ok); } .b-work { background: var(--accent-weak); color: var(--accent); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.toolbar .grow { flex: 1; }
input[type=text], input[type=password], select, textarea { border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; background: #fff; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-weak); border-color: var(--accent); }
textarea { width: 100%; min-height: 80px; resize: vertical; }
.chips { display: inline-flex; background: var(--track); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.chips button { border: 0; background: none; padding: 6px 11px; border-radius: 7px; cursor: pointer; color: var(--muted); font-size: 13px; }
.chips button.on { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--accent-2); }
.btn.ghost { background: #fff; color: var(--accent); border-color: var(--line2); }
.btn.ghost:hover { background: var(--accent-weak); }
.btn.danger { background: #fff; color: var(--danger); border-color: #f0c9c4; }
.btn.sm { padding: 5px 10px; font-size: 13px; font-weight: 500; }
.btn[disabled] { opacity: .6; cursor: wait; }
.empty { text-align: center; color: var(--muted); padding: 36px 12px; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.kv { display: grid; grid-template-columns: 200px 1fr; gap: 7px 16px; }
.kv > div:nth-child(odd) { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 12px 0 16px; }
.stats div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; } .stats b { display: block; font-size: 18px; } .stats span { font-size: 12px; color: var(--muted); }
.tabs2 { display: flex; gap: 18px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tabs2 button { border: 0; background: none; padding: 8px 0; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs2 button.on { color: var(--text); border-color: var(--accent); font-weight: 600; }
.steps { margin: 6px 0 0; padding-left: 22px; } .steps li { margin: 5px 0; }
.note { background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--muted); }
.regs { display: grid; grid-template-columns: 320px 1fr; gap: 16px; align-items: start; }
.reglist .grp { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted2); padding: 12px 14px 4px; }
.reglist button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 14px; cursor: pointer; border-left: 2px solid transparent; }
.reglist button:hover { background: var(--soft); } .reglist button.on { background: var(--accent-weak); border-left-color: var(--accent); }
.reglist button small { display: block; color: var(--muted2); font-size: 12px; }

/* ---------- отчётность в органы и зарплатная доска (v4.4) ---------- */
.fsteps { display: flex; gap: 4px; flex-wrap: wrap; }
.fstep { font-size: 11px; padding: 1px 7px; border-radius: 8px; border: 1px solid var(--line); color: var(--muted2); white-space: nowrap; }
.fstep.on { background: var(--accent-weak); border-color: var(--accent-weak); color: var(--accent); }
.fset { padding: 4px 6px; font-size: 12px; }
.pcell { line-height: 1.35; } .pcell.click { cursor: pointer; } .pcell .badge { margin-top: 3px; }
.pcal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.phead { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); text-align: center; }
.pday { min-height: 92px; border: 1px solid var(--line); border-radius: 10px; padding: 6px; display: flex; flex-direction: column; gap: 3px; background: var(--panel); min-width: 0; }
.pday.wk { background: var(--soft); } .pday.past { opacity: .6; } .pday.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pday.empty-d { border: 0; background: none; }
.pnum { font-family: var(--head); font-weight: 600; font-size: 12px; color: var(--muted); }
.pchip { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; font-size: 11px; border: 0; border-radius: 6px; padding: 2px 6px; cursor: pointer; }
.pchip.zp { background: var(--accent); color: #fff; } .pchip.av { background: var(--mist); color: var(--accent); border: 1px solid var(--aqua); }
@media (max-width: 900px) { .pcal { gap: 3px; } .pday { min-height: 64px; padding: 3px; } .pchip { font-size: 10px; padding: 1px 3px; } .phead { font-size: 10px; } }
/* ---------- боковая панель и окна ---------- */
.shade { position: fixed; inset: 0; background: rgba(23,42,51,.32); z-index: 20; display: none; }
.shade.open { display: block; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--panel); z-index: 21; box-shadow: -8px 0 30px rgba(0,0,0,.12); transform: translateX(105%); transition: transform .18s ease; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer.wide { width: min(860px, 100%); }
.dh { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.dh h3 { margin: 0 0 3px; font-size: 16px; }
.x { border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); padding: 0 4px; }
.db { padding: 16px 20px 30px; overflow-y: auto; flex: 1; }
.db label, .modal label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
.db input[type=text], .db select, .modal input, .modal select { width: 100%; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.box { background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-top: 16px; }
.box h4 { margin: 0 0 2px; font-size: 14px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.modal { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100% - 32px)); max-height: 90vh; overflow-y: auto; background: var(--panel); border-radius: var(--radius); z-index: 31; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.2); }
.modal h3 { margin: 0 0 6px; }
.modal-shade { position: fixed; inset: 0; background: rgba(23,42,51,.4); z-index: 30; }
.copyrow { display: flex; gap: 6px; } .copyrow input { flex: 1; font-family: ui-monospace, Consolas, monospace; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px; z-index: 40; font-size: 13px; max-width: calc(100% - 32px); }
.toast.err { background: var(--danger); }
.loading { padding: 60px; text-align: center; color: var(--muted); }

.timerbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: #eaf4ee; color: #14532d; border-bottom: 1px solid #cfe6d8; padding: 8px 28px; font-size: 13px; }
.timerbar .tick { font-variant-numeric: tabular-nums; font-size: 15px; }
.timerbar .tb-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
.pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #1e7a4c; margin-right: 6px; animation: pulse 1.4s infinite; vertical-align: middle; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(30,122,76,.5); } 70% { box-shadow: 0 0 0 7px rgba(30,122,76,0); } 100% { box-shadow: 0 0 0 0 rgba(30,122,76,0); } }
.tplan { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.tplan > div { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.tplan span { display: block; font-size: 12px; color: var(--muted); }
.tplan b { font-size: 15px; }
.tbl.mini-t td { padding: 6px 6px; font-size: 13px; }
.redit { display: grid; gap: 4px 6px; align-items: center; }
.redit .rh { font-size: 12px; color: var(--muted); }
.redit input { width: 100%; padding: 6px 8px; font-size: 13px; }
.redit .x { font-size: 18px; }
.btn .tick { font-variant-numeric: tabular-nums; color: #fff; opacity: .85; }

/* ---------- вход ---------- */
.login { min-height: 100vh; display: grid; place-items: center; padding: 20px; position: relative; overflow: hidden; }
/* мотив бренда: параллельные диагональные линии */
.login::before { content: ""; position: absolute; right: -140px; top: -80px; width: 520px; height: 520px; background: repeating-linear-gradient(60deg, transparent 0 22px, var(--aqua) 22px 24px); opacity: .45; pointer-events: none; }
.login .card { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px; position: relative; z-index: 1; }
.login h1 { font-size: 20px; margin: 14px 0 4px; }
.login label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 4px; }
.login input { width: 100%; padding: 10px 12px; }
.login .btn { width: 100%; margin-top: 18px; padding: 10px; }
.login .err { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 18px; }

/* ---------- телефон ---------- */
.mnav { display: none; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .side .nav, .side-foot .who span { display: none; }
  .brand { padding: 12px 16px; }
  .side-foot { padding: 8px 16px; border-top: 0; }
  .side-foot .who { display: none; }
  .mnav { display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .mnav button { flex: none; border: 1px solid var(--line); background: #fff; border-radius: 16px; padding: 6px 12px; cursor: pointer; }
  .mnav button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .top { padding: 12px 16px; position: static; } .content { padding: 16px 16px 50px; }
  .testbar, .viewbar, .timerbar { padding: 6px 16px; }
  .tbl.mini-t tr { display: grid; grid-template-columns: auto auto 1fr; } 
  .kpis, .minis { grid-template-columns: 1fr 1fr; }
  .cols, .regs { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(3, 1fr); }
  .kv { grid-template-columns: 1fr; gap: 0; } .kv > div:nth-child(even) { margin-bottom: 8px; }
  h1.hero { font-size: 21px; }
  .tbl thead { display: none; }
  .tbl, .tbl tbody, .tbl tr, .tbl td { display: block; width: 100%; }
  .tbl tr { border-bottom: 1px solid var(--line); padding: 8px 4px; }
  .tbl td { border: 0; padding: 2px 8px; }
  .tbl td[data-l]::before { content: attr(data-l) ": "; color: var(--muted); font-size: 12px; }
  .tbl .num { text-align: left; } .tbl td.nm { min-width: 0; } .acts { justify-content: flex-start; margin-top: 6px; }
  .prog { grid-template-columns: 1fr 70px; } .prog .bar { grid-column: 1 / -1; order: 3; }
  .g2 { grid-template-columns: 1fr; }
  .redit { grid-template-columns: 1fr !important; } .redit .rh { display: none; } .redit .x { justify-self: end; margin-bottom: 8px; }
}
</style>

const brandHtml = () => `${BRAND.logo ? `<img class="logo" src="${BRAND.logo}" alt="">` : ''}<div><b>${esc(BRAND.name)}</b><span>${esc(BRAND.product)}</span></div>`;
// ===================== связь с сервером =====================
const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) { /* не в Telegram */ } }
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* хранилище недоступно */ } },
};
// v4.3: принимаем только адрес веб-приложения Google Apps Script — ссылка с чужим адресом не уведёт логин и пароль
const okApi = u => /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(String(u || '')) || /^http:\/\/localhost(:\d+)?\/$/.test(String(u || ''));
const qsApi = new URLSearchParams(location.search).get('api');
const badApi = !!qsApi && !okApi(qsApi);
if (qsApi && !badApi) store.set('adalin_api', qsApi);
const API = (!badApi && qsApi) || (okApi(store.get('adalin_api')) ? store.get('adalin_api') : '');
const S = { token: store.get('adalin_token'), data: null, as: null, view: null, drawer: null,
  f: { q: '', emp: '', client: '', period: '', st: 'open' }, regSel: null, regQ: '', progPeriod: '' };

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = v => (v === '' || v == null || isNaN(Number(v))) ? '' : Number(v).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const low = s => String(s == null ? '' : s).trim().toLowerCase();
const parseD = s => { const m = String(s || '').match(/^(\d{2})\.(\d{2})\.(\d{4})$/); return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null; };

async function call(action, params) {
  if (badApi) throw new Error('Неверный адрес CRM в ссылке. Откройте ссылку, которую прислал руководитель, и не вводите пароль на других страницах.');
  if (!API) throw new Error('Не указан адрес сервера. Откройте ссылку, которую прислал руководитель (она содержит «?api=…»).');
  const body = { action, params: Object.assign({}, params || {}, S.as && action !== 'login' ? { as: S.as } : {}) };
  if (S.token) body.token = S.token; else if (tg) body.initData = tg.initData;
  let j;
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify(body), redirect: 'follow' });
    j = await r.json();
  } catch (e) { throw new Error('Сервер не отвечает. Проверьте интернет и попробуйте ещё раз.'); }
  if (!j.ok && j.auth) { logoutLocal(); const e = new Error(S.data === null && action === 'me' ? '' : (j.error || 'Войдите снова.')); e.auth = true; throw e; }
  if (!j.ok) throw new Error(j.error || 'Ошибка сервера');
  return j;
}
async function act(action, params, btn) {
  const old = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Сохраняю…'; }
  try {
    const j = await call(action, params);
    if (j.mustChange) { S.data = null; renderPassword(true); return null; }
    S.data = j; render(); return j;
  } catch (e) { if (e.auth) { renderLogin(e.message || 'Сессия истекла. Войдите снова.'); return null; } toast(e.message, true); return null; }
  finally { if (btn && document.body.contains(btn)) { btn.disabled = false; btn.textContent = old; } }
}
function toast(msg, err) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 5000 : 2500);
}
function logoutLocal() { S.token = null; S.data = null; S.as = null; store.set('adalin_token', null); }

// ===================== вход и пароль =====================
function renderLogin(msg) {
  closeDrawer();
  $('root').innerHTML = `<div class="login"><form class="card" id="lf" autocomplete="on">
    <div class="brand" style="padding:0">${brandHtml()}</div>
    <h1>Вход в систему</h1><div class="muted small">Для сотрудников и клиентов компании</div>
    <label for="lg">Логин</label><input type="text" id="lg" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    <label for="pw">Пароль</label><input type="password" id="pw" autocomplete="current-password" required>
    <button class="btn" id="lb">Войти</button>
    <div class="err" id="le">${esc(msg || '')}</div>
    <div class="muted small" style="margin-top:6px">Логин и временный пароль выдаёт руководитель. Забыли пароль — обратитесь к нему, он выдаст новый.</div>
  </form></div>`;
  $('lg').focus();
  $('lf').onsubmit = async e => {
    e.preventDefault();
    $('lb').disabled = true; $('le').textContent = '';
    try {
      const j = await call('login', { login: $('lg').value, password: $('pw').value });
      S.token = j.token; store.set('adalin_token', j.token);
      if (j.mustChange) renderPassword(true); else await start();
    } catch (err) { $('le').textContent = err.message; $('lb').disabled = false; }
  };
}
function renderPassword(first) {
  const html = `<form class="card" id="pf">
    <div class="brand" style="padding:0">${brandHtml()}</div>
    <h1>${first ? 'Придумайте свой пароль' : 'Смена пароля'}</h1>
    <div class="muted small">${first ? 'Временный пароль больше не понадобится. ' : ''}Не короче 8 символов, буквы и цифры.</div>
    ${first ? '' : '<label>Текущий пароль</label><input type="password" id="po" autocomplete="current-password" required>'}
    <label>Новый пароль</label><input type="password" id="p1" autocomplete="new-password" required>
    <label>Повторите новый пароль</label><input type="password" id="p2" autocomplete="new-password" required>
    <button class="btn" id="pb">Сохранить пароль</button>
    ${first ? '' : '<button type="button" class="btn ghost" id="pc" style="margin-top:8px">Отмена</button>'}
    <div class="err" id="pe"></div></form>`;
  if (first) { $('root').innerHTML = '<div class="login">' + html + '</div>'; }
  else openModal(html.replace('class="card"', 'class=""'));
  if ($('pc')) $('pc').onclick = closeModal;
  $('pf').onsubmit = async e => {
    e.preventDefault();
    if ($('p1').value !== $('p2').value) { $('pe').textContent = 'Пароли не совпадают.'; return; }
    $('pb').disabled = true;
    try {
      await call('password.change', { password: $('p1').value, old: $('po') ? $('po').value : '' });
      closeModal(); toast('Пароль изменён'); if (first) await start();
    } catch (err) { $('pe').textContent = err.message; $('pb').disabled = false; }
  };
}

// ===================== запуск =====================
async function start() {
  if (!tg && !S.token) return renderLogin();
  $('root').innerHTML = '<div class="loading">Загрузка…</div>';
  try {
    const j = await call('me');
    if (j.mustChange) return renderPassword(true);
    S.data = j; render();
  } catch (e) {
    if (e.auth) renderLogin(e.message);
    else $('root').innerHTML = `<div class="login"><div class="card"><b>Не удалось загрузить данные</b><p class="muted">${esc(e.message)}</p><button class="btn" onclick="location.reload()">Обновить</button></div></div>`;
  }
}

// ===================== меню по ролям =====================
function navFor(d) {
  const openReq = (d.requests || []).length;
  const over = (d.tasks || []).filter(t => t.overdue).length;
  const todayT = d.today ? parseD(d.today).getTime() : 0;
  const fUrg = (d.tasks || []).filter(t => t.filing && fUrgent(t.filing, todayT)).length;
  if (d.role === 'клиент') return [
    { sec: null, items: [['deadlines', 'Сроки платежей'], ['need', 'Что нужно от вас', d.requests.length], ['reports', 'Отчёты']] }];
  if (d.role === 'сотрудник') return [
    { sec: null, items: [['tasks', 'Мои задачи', over], ['requests', 'Запросы клиентам', openReq], ['filings', 'Отчётность в органы', fUrg], ['payroll', 'Зарплатная доска'], ['clients', 'Мои клиенты'], ['time', 'Моё время']] },
    { sec: 'Справочники', items: [['regs', 'Регламенты']] }];
  return [

const isDone = t => low(t['Статус']) === 'выполнено';

function badge(t) {
  if (t.overdue) return '<span class="badge b-over">просрочено</span>';
  if (isDone(t)) return '<span class="badge b-done">выполнено</span>';
  if (isWait(t)) return '<span class="badge b-wait">ждём клиента</span>';
  if (low(t['Статус']) === 'в работе') return '<span class="badge b-work">в работе</span>';

}
function sumText(t) {
  if (t.kind === 'zp') return t['Сумма к выплате'] !== '' ? money(t['Сумма к выплате']) : '—';
  if (t.kind === 'tax' || t.kind === 'avans') return t['Сумма'] !== '' ? money(t['Сумма']) : '—';
  return '';
}
function needsSum(t) {
  if (isDone(t) && t.kind === 'none') return false;
  if (t.kind === 'zp') return t['Сумма к выплате'] === '' || t['Подоходный'] === '' || t['ФСЗН'] === '';
  if (t.kind === 'tax' || t.kind === 'avans') return t['Сумма'] === '';
  return false;
}

function leadStats(d) {
  const L = d.leads || [], month = d.today ? (() => { const p = parseD(d.today); return p ? ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'][p.getMonth()] + ' ' + p.getFullYear() : ''; })() : '';
  const feeField = (d.moneyFields || []).find(f => /абонент/i.test(f));
  const calc = arr => {
    const won = arr.filter(l => l['Статус'] === 'клиент'), lost = arr.filter(l => l['Статус'] === 'отказ');
    const fee = won.reduce((a, l) => { const c = d.clientCards.find(x => x['Код'] === l['Код клиента']); return a + (c && feeField ? Number(c[feeField]) || 0 : 0); }, 0);
    return { all: arr.length, open: arr.filter(l => !LEAD_DONE.includes(l['Статус'])).length, won: won.length, lost: lost.length, conv: arr.length ? Math.round(won.length / arr.length * 100) : 0, fee };
  };
  const by = key => { const m = {}; L.forEach(l => { const k = l[key] || '—'; m[k] = m[k] || { all: 0, won: 0 }; m[k].all++; if (l['Статус'] === 'клиент') m[k].won++; }); return Object.entries(m).sort((a, b) => b[1].all - a[1].all); };
  const reasons = {}; L.filter(l => l['Статус'] === 'отказ').forEach(l => { const k = l['Причина отказа'] || 'не указана'; reasons[k] = (reasons[k] || 0) + 1; });
  return { month, cur: calc(L.filter(l => l.month === month)), total: calc(L), byService: by('Услуга'), bySource: by('Источник'), reasons: Object.entries(reasons).sort((a, b) => b[1] - a[1]) };
}
function leadsDashHtml(d) {
  if (!d.leads) return '';
  const s = leadStats(d), row = (lbl, a, b) => `<tr><td>${esc(lbl)}</td><td class="num">${a}</td><td class="num">${b}</td></tr>`;
  const mini = (title, arr) => arr.length ? `<div><h4 style="margin:12px 0 6px">${esc(title)}</h4><table class="tbl"><tbody>${arr.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${v.all !== undefined ? v.all + ' · клиентов ' + v.won : v}</td></tr>`).join('')}</tbody></table></div>` : '';
  return `<div class="panel pad"><div class="ph"><h3>Заявки и новые клиенты</h3><span>нажмите, чтобы открыть заявки</span></div>
    <table class="tbl click" id="leadDash"><thead><tr><th></th><th class="num">${esc(s.month)}</th><th class="num">всё время</th></tr></thead><tbody>

// ===================== ОТЧЁТНОСТЬ В ОРГАНЫ (v4.4) =====================
// Отчёт — задача со сроком подачи. Шаги: подготовлен → отправлен → принят инспектором → налог оплачен.
const F_ORDER = ['', 'подготовлен', 'отправлен', 'принят', 'оплачен'];
const F_LABEL = { '': 'не подготовлен', 'подготовлен': 'подготовлен', 'отправлен': 'отправлен', 'принят': 'принят инспектором', 'оплачен': 'налог оплачен' };
const fSteps = f => F_ORDER.filter(x => x !== 'оплачен' || f.needsPay);
const fNext = f => { const st = fSteps(f); return st[st.indexOf(f.status) + 1] || null; };
const fUrgent = (f, today) => (f.status === '' || f.status === 'подготовлен') && f.dts && f.dts <= today + 3 * 86400000;
const fKind = t => {
  const k = String(t.title || '').replace(/\s+(за|на)\s+.*$/, '').replace(/^Подготовить и подать |^Подготовить |^Подать /, '').replace(/^декларацию/, 'декларация');
  return k.charAt(0).toUpperCase() + k.slice(1);
};
function fBadge(f, today) {
  const cls = f.finished ? 'b-done' : f.status === 'принят' || f.status === 'отправлен' ? 'b-work' : fUrgent(f, today) ? 'b-over' : f.status === 'подготовлен' ? 'b-wait' : '';
  return `<span class="badge ${cls}">${esc(F_LABEL[f.status])}${!f.needsPay && f.status === 'принят' ? ' · платить нечего' : ''}</span>`;
}
function vFilings() {
  const d = S.data, mgr = d.role === 'руководитель', today = parseD(d.today).getTime();
  const f = S.ff || (S.ff = { st: 'active', period: '', kind: '', emp: '' });
  let all = d.tasks.filter(t => t.filing);
  if (f.emp) all = all.filter(t => t.employee === f.emp);
  const periods = [...new Set(all.map(t => t.period))], kinds = [...new Set(all.map(fKind))].sort();

// ===================== ЗАРПЛАТНАЯ ДОСКА (v4.4) =====================
// Клиенты с работниками: даты аванса и зарплаты в месяце, суммы и состояние. Таблица или календарь.
const yesV = v => /^да/i.test(String(v == null ? '' : v).trim());
const WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
const dd = x => String(x.getDate()).padStart(2, '0') + '.' + String(x.getMonth() + 1).padStart(2, '0');
function payEvents(d, y, m) {
  const last = new Date(y, m + 1, 0).getDate();
  const cl = d.clientCards.filter(c => yesV(c['Есть работники']) && (!c['Статус'] || low(c['Статус']) === 'активный'));
  return cl.map(c => {
    const ev = ['AVANS', 'ZP'].map(kind => {
      const inMonth = t => { const x = parseD(t.payDate || t.deadline); return x && x.getFullYear() === y && x.getMonth() === m; };
      const t = d.tasks.find(x => x.clientCode === c['Код'] && x.rule === kind && inMonth(x));
      const day = Number(c[kind === 'ZP' ? 'День выплаты ЗП' : 'День выплаты аванса']) || 0;
      const date = t ? parseD(t.payDate || t.deadline) : day ? new Date(y, m, Math.min(day, last)) : null;
      if (!date) return null;
      const sum = t ? (kind === 'ZP' ? t['Сумма к выплате'] : t['Сумма']) : '';
      let st = ['', 'по карточке']; // задачи на этот месяц ещё нет (создаётся 1-го числа)
      if (t) st = isDone(t) ? ['b-done', 'рассчитано'] : sum === '' ? ['b-over', 'нет суммы'] : t['Платёжка'] === 'подготовлена' ? ['b-done', 'платёжка готова'] : t['Платёжка'] === 'клиент платит сам' ? ['b-work', 'платит сам'] : ['b-wait', 'сумма есть'];
      return { kind, label: kind === 'ZP' ? 'Зарплата' : 'Аванс', date, task: t, sum, st };
    }).filter(Boolean);
    return { c, ev };
  }).filter(x => x.ev.length);
}
function vPayroll() {
  const d = S.data, mgr = d.role === 'руководитель', base = parseD(d.today);
  const off = S.payOff || 0, view = S.payView || 'table';
  const first = new Date(base.getFullYear(), base.getMonth() + off, 1), y = first.getFullYear(), m = first.getMonth();
  const label = first.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
  const rows = payEvents(d, y, m);
  const todayT = base.getTime();
  const nextT = r => { const up = r.ev.map(e => e.date.getTime()).filter(x => x >= todayT); return up.length ? Math.min(...up) : 9e15 + Math.min(...r.ev.map(e => e.date.getTime())); };
  rows.sort((a, b) => nextT(a) - nextT(b));
  const cell = e => e ? `<div class="pcell${e.task ? ' click' : ''}" ${e.task ? `data-open="${esc(e.task.id)}"` : ''}><b>${dd(e.date)}</b> <span class="muted small">${WD[e.date.getDay()]}</span>
      ${e.sum !== '' ? `<div>${esc(money(e.sum))} BYN</div>` : ''}<span class="badge ${e.st[0]}">${esc(e.st[1])}</span></div>` : '<span class="muted">—</span>';
  let body;
  if (!rows.length) body = '<div class="panel empty">Клиентов с работниками нет — отметьте «Есть работники» и дни выплат в карточках.</div>';
  else if (view === 'table') body = `<div class="panel twrap"><table class="tbl"><thead><tr><th>Клиент</th><th>Аванс</th><th>Зарплата</th>${mgr ? '<th>Ответственный</th>' : ''}</tr></thead><tbody>
    ${rows.map(r => `<tr><td class="nm" data-l="Клиент"><b>${esc(r.c['Клиент'])}</b><div class="sub">${esc(r.c['Тип'] || '')}</div></td>
      <td data-l="Аванс">${cell(r.ev.find(e => e.kind === 'AVANS'))}</td><td data-l="Зарплата">${cell(r.ev.find(e => e.kind === 'ZP'))}</td>
      ${mgr ? `<td data-l="Ответственный">${esc(r.c['Ответственный'] || '')}</td>` : ''}</tr>`).join('')}</tbody></table></div>`;
  else {
    const byDay = {}; rows.forEach(r => r.ev.forEach(e => { (byDay[e.date.getDate()] = byDay[e.date.getDate()] || []).push({ e, c: r.c }); }));
    const lead = (first.getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate(), cells = [];

      cells.push(`<div class="pday${wk ? ' wk' : ''}${isToday ? ' today' : ''}${dt.getTime() < todayT ? ' past' : ''}"><div class="pnum">${day}</div>
        ${(byDay[day] || []).map(x => `<button class="pchip ${x.e.kind === 'ZP' ? 'zp' : 'av'}" ${x.e.task ? `data-open="${esc(x.e.task.id)}"` : ''} title="${esc(x.e.label + ' · ' + x.c['Клиент'] + (x.e.sum !== '' ? ' · ' + money(x.e.sum) + ' BYN' : '') + ' · ' + x.e.st[1])}">${x.e.kind === 'ZP' ? 'ЗП' : 'А'} · ${esc(x.c['Клиент'])}</button>`).join('')}</div>`);
    }
    body = `<div class="panel pad"><div class="pcal">${['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].map(w => `<div class="phead">${w}</div>`).join('')}${cells.join('')}</div>
      <p class="muted small" style="margin:10px 0 0"><span class="pchip av">А</span> аванс · <span class="pchip zp">ЗП</span> зарплата. Нажмите, чтобы открыть задачу.</p></div>`;
  }
  $('content').innerHTML = `
    <div class="toolbar"><button class="btn ghost sm" id="pPrev" aria-label="Предыдущий месяц">‹</button><b style="min-width:150px;text-align:center">${esc(label)}</b><button class="btn ghost sm" id="pNext" aria-label="Следующий месяц">›</button>
      ${off ? '<button class="linkbtn" id="pNow">текущий месяц</button>' : ''}<span class="grow"></span>
      <div class="chips" id="pView"><button data-v="table" class="${view === 'table' ? 'on' : ''}">Таблица</button><button data-v="cal" class="${view === 'cal' ? 'on' : ''}">Календарь</button></div></div>
    ${body}
    <p class="muted small">Даты — из задач «Зарплата» и «Аванс» (с переносом с выходных). Если задачи на месяц ещё нет — день из карточки клиента («по карточке»). Клиентов с выплатами: ${rows.length}.</p>`;
  $('pPrev').onclick = () => { S.payOff = off - 1; vPayroll(); };
  $('pNext').onclick = () => { S.payOff = off + 1; vPayroll(); };
  if ($('pNow')) $('pNow').onclick = () => { S.payOff = 0; vPayroll(); };
  $('pView').onclick = e => { const b = e.target.closest('button'); if (b) { S.payView = b.dataset.v; vPayroll(); } };
  $('content').querySelectorAll('[data-open]').forEach(el => el.onclick = () => openTask(el.dataset.open));
}

    todo: m.filter(t => !isDone(t) && low(t['Статус']) !== 'в работе' && !isWait(t)).length, over: m.filter(t => t.overdue).length, wait: m.filter(isWait).length };

function saveB64(b64, fileName, type) {
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([arr], { type }));
  const a = document.createElement('a'); a.href = url; a.download = fileName; a.style.display = 'none'; document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 10000);
}

  } catch (e) { toast(e.message, true); }
  finally { btn.disabled = false; btn.textContent = old; }
}

      <div class="panel pad"><div class="ph"><h3>По клиентам</h3><span>${mgr && fee ? (monthly ? 'BYN за час = абон. плата ÷ часы за месяц' : 'BYN за час считается за месяц') : ''}</span></div>
        <table class="tbl" style="margin-top:6px"><thead><tr><th>Клиент</th><th class="num">Время</th><th class="num">Задач</th>${mgr && fee ? '<th class="num">Абон. плата</th><th class="num">BYN за час</th>' : ''}</tr></thead><tbody>${byCl}</tbody></table></div>
      ${!mgr ? `<div class="panel pad"><div class="ph"><h3>По видам задач</h3><span>за всё время</span></div><table class="tbl" style="margin-top:6px"><thead><tr><th>Вид</th><th class="num">Задач</th><th class="num">Среднее факт</th><th class="num">Средний план</th></tr></thead><tbody>${byKind}</tbody></table></div>` : ''}
    </div>
    ${mgr ? `<div class="panel pad" style="margin-bottom:16px"><div class="ph"><h3>По видам задач — основа для норм времени</h3><span>все задачи с учётом времени; норму можно вписать в «Правила сроков», колонка «Плановое время, мин»</span></div>
      <table class="tbl" style="margin-top:6px"><thead><tr><th>Вид задачи</th><th class="num">Задач</th><th class="num">Среднее факт</th><th class="num">Средний план</th></tr></thead><tbody>${byKind}</tbody></table></div>` : ''}
    <div class="panel"><div class="pad" style="padding-bottom:0"><div class="ph"><h3>Сессии</h3><span>${list.length < ses.length ? 'последние 300' : ''}</span></div></div>
      <table class="tbl"><thead><tr><th>Дата</th><th>Время</th><th class="num">Длительность</th><th>Клиент и задача</th>${mgr ? '<th>Сотрудник</th>' : ''}<th></th></tr></thead><tbody>
      ${list.map(s => `<tr><td data-l="Дата">${esc(s.date)}</td><td data-l="Время">${hhmm(s.start)}–${s.open ? '<b>идёт</b>' : hhmm(s.end)}</td>
        <td class="num" data-l="Длительность">${s.min > 240 ? `<span class="badge b-wait" title="Проверьте, не забыт ли таймер">${fmtMin(s.min)}</span>` : fmtMin(s.min)}</td>
        <td><b>${esc(s.client)}</b><div class="sub">${esc(s.task)}${s.how && s.how !== 'таймер' ? ' · ' + esc(s.how) : ''}${s.comment ? ' · ' + esc(s.comment) : ''}</div></td>
        ${mgr ? `<td data-l="Сотрудник">${esc(s.person)}</td>` : ''}
        <td><div class="acts">${!s.open && canEditSession(s) ? `<button class="btn ghost sm" data-se="${esc(s.id)}">Изменить</button>` : ''}<button class="btn ghost sm" data-task="${esc(s.taskId)}">Задача</button></div></td></tr>`).join('')}
      </tbody></table></div>`}`;
  $('tper').onclick = e => { const b = e.target.closest('button'); if (b) { S.tper = b.dataset.p; vTime(); } };
  if ($('temp')) $('temp').onchange = e => { S.temp = e.target.value; vTime(); };
  $('content').querySelectorAll('[data-person]').forEach(r => r.onclick = () => { S.temp = S.temp === r.dataset.person ? '' : r.dataset.person; vTime(); window.scrollTo(0, 0); });
  if ($('tall')) $('tall').onclick = () => { S.temp = ''; vTime(); };
  $('content').querySelectorAll('[data-se]').forEach(b => b.onclick = () => editSession(b.dataset.se));
  $('content').querySelectorAll('[data-cl]').forEach(r => r.onclick = () => openClient(r.dataset.cl));
  bindTaskRows($('content'));
}

function vDeadlines() {

    <div class="panel">${d.deadlines.length ? `<table class="tbl"><thead><tr><th>Срок</th><th>Платёж</th><th class="num">Сумма, BYN</th><th>Платёжка</th></tr></thead><tbody>
      ${d.deadlines.map(x => `<tr><td data-l="Срок"><b>${esc(x.date)}</b></td><td>${esc(x.what)}${x.extra ? `<div class="sub">${esc(x.extra)}</div>` : ''}</td><td class="num" data-l="Сумма"><b>${esc(x.sum)}</b></td>
      <td data-l="Платёжка">${x.prepared ? '<span class="badge b-done">подготовлена — подпишите в банк-клиенте</span>' : '<span class="muted small">—</span>'}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">Ближайших платежей нет</div>'}</div>
    ${d.employee ? `<p class="muted small">Ваш бухгалтер: ${esc(d.employee)}. Вопросы и документы можно присылать в Telegram-бот ${BRAND.name} — мы передадим.</p>` : ''}`;

    ${r.length ? r.map(x => `<div class="panel pad" style="margin-bottom:10px"><div class="muted small">с ${esc(x.date)}</div><div style="margin-top:4px">${esc(x.text)}</div></div>`).join('') +
      `<p class="muted small">Документы и ответы присылайте в чат с ботом ${esc(BRAND.name)} — мы передадим их вашему бухгалтеру.</p>` : '<div class="panel empty">Сейчас от вас ничего не нужно</div>'}`;

function vReports() {
  const d = S.data;
  if (d.role === 'клиент') return vClientReports();
  const reps = d.reports || [];
  const pers = [...new Set([d.reportPeriod, ...reps.map(r => r.period), ...periods()].filter(Boolean))];
  const per = S.repPer && pers.includes(S.repPer) ? S.repPer : d.reportPeriod;
  const active = d.clientCards.filter(c => low(c['Статус']) === 'активный');
  const stBadge = r => !r ? '<span class="badge">нет черновика</span>'
    : r.status === 'отправлен' ? `<span class="badge b-done">отправлен ${esc(r.sent)}</span>`
    : r.status === 'утверждён' ? '<span class="badge b-work">утверждён, уйдёт 28-го</span>'
    : `<span class="badge b-wait">черновик${r.kind === 'с причинами' ? ' с причинами' : ''}</span>`;
  const rows = active.map(c => {
    const t = d.tasks.filter(x => x.clientCode === c['Код'] && x.period === per);
    const pl = t.filter(x => x.type !== 'разовая'), dn = pl.filter(isDone).length;
    const r = reps.find(x => x.clientCode === c['Код'] && x.period === per);
    return { c, t, pl, dn, r };
  }).filter(x => x.t.length || x.r);
  const cnt = s => rows.filter(x => x.r && x.r.status === s).length;
  $('content').innerHTML = `
    <div class="toolbar"><select id="rper">${pers.map(p => `<option ${p === per ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select>
      <span class="muted small">Черновик собирается сам: как только выполнены все плановые задачи клиента, а 26-го — по всем остальным, с причинами. Без вашего утверждения ничего не уходит; 28-го уходят утверждённые.</span></div>
    <div class="minis" style="grid-template-columns:repeat(4,1fr)">
      <div class="panel mini"><div class="l">Клиентов с работой за ${esc(per)}</div><div class="v">${rows.length}</div></div>
      <div class="panel mini"><div class="l">Ждут вашего утверждения</div><div class="v" style="color:${cnt('черновик') ? 'var(--warn)' : 'inherit'}">${cnt('черновик')}</div></div>
      <div class="panel mini"><div class="l">Утверждены, уйдут 28-го</div><div class="v">${cnt('утверждён')}</div></div>
      <div class="panel mini"><div class="l">Отправлены</div><div class="v">${cnt('отправлен')}</div></div>
    </div>
    <div class="panel twrap">${rows.length ? `<table class="tbl"><thead><tr><th>Клиент</th><th>Плановые задачи</th><th>Отчёт</th><th></th></tr></thead><tbody>
      ${rows.map(x => { const pct = x.pl.length ? Math.round(x.dn / x.pl.length * 100) : 0; return `<tr>
        <td class="nm"><b>${esc(x.c['Клиент'])}</b><div class="sub">${esc(x.c['Ответственный'])}</div></td>
        <td data-l="Плановые"><div style="display:flex;gap:10px;align-items:center;min-width:180px"><div class="bar" style="flex:1"><i style="width:${pct}%;${pct === 100 ? 'background:var(--ok)' : ''}"></i></div><span class="small">${x.dn} из ${x.pl.length}</span></div></td>
        <td data-l="Отчёт">${stBadge(x.r)}${x.r && x.r.approved ? `<div class="sub">утвердил(а) ${esc(x.r.by)} ${esc(x.r.approved)}</div>` : ''}</td>
        <td><div class="acts">${x.r ? `<button class="btn ${x.r.status === 'черновик' ? '' : 'ghost'} sm" data-rep="${esc(x.r.id)}">${x.r.status === 'черновик' ? 'Проверить и утвердить' : 'Открыть'}</button>`
          : `<button class="btn ghost sm" data-build="${esc(x.c['Код'])}">Собрать черновик сейчас</button>`}</div></td></tr>`; }).join('')}</tbody></table>`
      : '<div class="empty">За этот период задач нет</div>'}</div>`;
  $('rper').onchange = e => { S.repPer = e.target.value; vReports(); };
  $('content').querySelectorAll('[data-rep]').forEach(b => b.onclick = () => openReport(b.dataset.rep));
  $('content').querySelectorAll('[data-build]').forEach(b => b.onclick = async () => {
    const r = await act('report.build', { clientCode: b.dataset.build, period: per }, b);
    if (r) { toast('Черновик собран'); openReport(r.reportId); }
  });
}
const REP_SECTIONS = [
  ['done', 'Выполненные работы', [['work', 'Работа', 3], ['date', 'Выполнено', 1], ['result', 'Результат', 3]], '+ Добавить работу'],
  ['pay', 'Суммы к уплате за период', [['what', 'Платёж', 3], ['period', 'Период', 2], ['sum', 'Сумма, BYN', 1], ['date', 'Срок', 1]], '+ Добавить платёж'],
  ['notDone', 'Что пока не выполнено', [['work', 'Работа', 3], ['reason', 'Причина', 3], ['need', 'Что нужно от клиента', 3]], '+ Добавить строку'],
  ['next', 'Ближайшие сроки', [['date', 'Дата', 1], ['what', 'Что', 4], ['sum', 'Сумма, BYN', 2]], '+ Добавить срок'],
];
async function openReport(id, tab) {
  showDrawer('<div class="dh"><div><h3>Отчёт</h3></div><button class="x" id="dx">×</button></div><div class="db"><div class="loading">Загрузка…</div></div>', null, true);
  $('dx').onclick = closeDrawer;
  let j;
  try { j = await call('report.view', { id }); } catch (e) { toast(e.message, true); closeDrawer(); return; }
  const rp = j.report, meta = (S.data.reports || []).find(r => r.id === id) || {};
  const mgr = S.data.role === 'руководитель' && !S.data.viaManager;
  const draft = rp.status === 'черновик';
  tab = draft && mgr ? (tab || 'view') : 'view';
  const today = parseD(S.data.today), before28 = today && today.getDate() < 28;
  const ed = rp.data ? JSON.parse(JSON.stringify(rp.data)) : null;
  const editorHtml = () => `<label>Итог (первая строка отчёта)</label><textarea data-sum style="min-height:50px">${esc(ed.summary)}</textarea>` +
    REP_SECTIONS.map(([key, title, cols, addLbl]) => `<h4 style="margin:18px 0 6px">${esc(title)}</h4>
      <div class="redit" style="grid-template-columns:${cols.map(c => c[2] + 'fr').join(' ')} 28px">
        ${cols.map(c => `<div class="rh">${esc(c[1])}</div>`).join('')}<div></div>
        ${(ed[key] || []).map((row, i) => cols.map(c => `<input type="text" data-k="${key}" data-i="${i}" data-f="${c[0]}" value="${esc(row[c[0]])}">`).join('') + `<button class="x" title="Убрать строку" data-del="${key}" data-i="${i}">×</button>`).join('')}
      </div>${!(ed[key] || []).length ? '<div class="muted small">Раздел пустой — в отчёт не попадёт.</div>' : ''}
      <button class="linkbtn" data-add="${key}">${esc(addLbl)}</button>`).join('') +
    `<label style="margin-top:18px">Комментарий для клиента (необязательно)</label><textarea id="rcm">${esc(rp.comment)}</textarea>`;
  showDrawer(`<div class="dh"><div><h3>${esc(meta.client || 'Отчёт')} — ${esc(meta.period || '')}</h3>
      <div class="muted small">${draft ? (rp.edited ? 'Черновик с вашими правками. Изменения в задачах в него уже не попадают — чтобы учесть их, нажмите «Собрать заново из задач».' : 'Черновик собирается из задач при каждом открытии. Поправьте, если нужно, и утвердите.') : rp.status === 'утверждён' ? 'Утверждён, уйдёт клиенту 28-го.' : 'Отправлен клиенту ' + esc(meta.sent || '') + '.'}</div></div><button class="x" id="dx">×</button></div>
    <div class="db">
      ${mgr && draft ? `<div class="tabs2" id="rtabs"><button data-t="view" class="${tab === 'view' ? 'on' : ''}">Просмотр</button><button data-t="edit" class="${tab === 'edit' ? 'on' : ''}">Редактировать</button></div>` : ''}
      ${tab === 'edit' ? `<div id="redit">${editorHtml()}</div>
        <div class="actions"><button class="btn" id="rsave">Сохранить правки</button><button class="btn ghost" id="rcancel">Отмена</button><span style="flex:1"></span>${rp.edited ? '<button class="btn danger" id="rreb">Собрать заново из задач</button>' : ''}</div>`
      : `${mgr ? `<div class="actions" style="margin-top:0">
          ${draft ? `<button class="btn" id="rap">${rp.complete || !before28 ? 'Утвердить и отправить клиенту' : 'Утвердить — уйдёт 28-го'}</button><button class="btn ghost" id="redt">Редактировать</button>` : ''}
          ${rp.status === 'утверждён' ? '<button class="btn ghost" id="run">Вернуть в черновик</button>' : ''}
          <button class="btn ghost" id="rpdf">Скачать PDF</button>${draft && rp.edited ? '<span style="flex:1"></span><button class="btn danger" id="rreb">Собрать заново из задач</button>' : ''}</div>
          ${draft && !rp.complete ? '<div class="note" style="margin-top:8px">Не все работы выполнены — в отчёте есть раздел «Что пока не выполнено».</div>' : ''}` : ''}
        <div class="panel pad" style="margin-top:14px;background:#fff">${rp.html}</div>`}
    </div>`, () => openReport(id, tab), true);
  $('dx').onclick = closeDrawer;
  if ($('rtabs')) $('rtabs').onclick = e => { const b = e.target.closest('button'); if (b) openReport(id, b.dataset.t); };
  if ($('redt')) $('redt').onclick = () => openReport(id, 'edit');
  if ($('rpdf')) $('rpdf').onclick = () => downloadReport(id, $('rpdf'));
  if ($('rreb')) $('rreb').onclick = async () => {
    if ($('rreb').dataset.sure !== '1') { $('rreb').dataset.sure = '1'; $('rreb').textContent = 'Правки пропадут — точно?'; return; }
    S.drawer = () => openReport(id, 'view');
    if (await act('report.rebuild', { id }, $('rreb'))) toast('Черновик собран заново из задач');
  };
  if ($('rap')) $('rap').onclick = async () => {
    if ($('rap').dataset.sure !== '1') { $('rap').dataset.sure = '1'; $('rap').textContent = 'Подтвердите: ' + $('rap').textContent; return; }
    const r = await act('report.approve', { id }, $('rap'));
    if (r) toast(r.approved.sent ? (r.approved.ok ? 'Отчёт отправлен клиенту' : 'Утверждён, но не отправлен: ' + r.approved.note) : 'Утверждён — уйдёт клиенту 28-го');
  };
  if ($('run')) $('run').onclick = async () => { if (await act('report.unapprove', { id }, $('run'))) toast('Возвращён в черновик — можно править'); };
  if (tab === 'edit') {
    const box = $('redit');
    const collect = () => {
      box.querySelectorAll('[data-k]').forEach(el => { ed[el.dataset.k][+el.dataset.i][el.dataset.f] = el.value; });
      ed.summary = box.querySelector('[data-sum]').value;
    };
    const redraw = () => { const cm = $('rcm').value; box.innerHTML = editorHtml(); $('rcm').value = cm; bindEd(); };
    const bindEd = () => {
      box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { collect(); ed[b.dataset.del].splice(+b.dataset.i, 1); redraw(); });
      box.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { collect(); (ed[b.dataset.add] = ed[b.dataset.add] || []).push({}); redraw(); const ins = box.querySelectorAll(`[data-k="${b.dataset.add}"]`); if (ins.length) ins[ins.length - REP_SECTIONS.find(s => s[0] === b.dataset.add)[2].length].focus(); });
    };
    bindEd();
    $('rcancel').onclick = () => openReport(id, 'view');
    $('rsave').onclick = async () => {
      collect();
      S.drawer = () => openReport(id, 'view');
      if (await act('report.save', { id, data: ed, comment: $('rcm').value }, $('rsave'))) toast('Правки сохранены');
    };
  }
}
async function downloadReport(id, btn) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = 'Готовлю PDF…';
  try {
    const j = await call('report.pdf', { id });
    const bin = atob(j.pdf.base64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
    const a = document.createElement('a'); a.href = url; a.download = j.pdf.ascii || j.pdf.name; /* латиница — имя файла сохраняется во всех браузерах */ a.style.display = 'none'; document.body.appendChild(a); a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 10000);
  } catch (e) { toast(e.message, true); }
  finally { btn.disabled = false; btn.textContent = old; }
}
function vClientReports() {
  const r = S.data.reports || [];
  $('content').innerHTML = `<h1 class="hero" style="margin-top:0">Отчёты о работе</h1><p class="lead">Отчёт за месяц приходит в следующем месяце — не позже 28-го числа. Копия всегда здесь.</p>
    ${r.length ? `<div class="panel"><table class="tbl"><thead><tr><th>Период</th><th>Отправлен</th><th></th></tr></thead><tbody>
      ${r.map(x => `<tr><td><b>${esc(x.period)}</b></td><td data-l="Отправлен">${esc(x.sent)}</td><td><div class="acts"><button class="btn ghost sm" data-open="${esc(x.id)}">Открыть</button><button class="btn sm" data-pdf="${esc(x.id)}">Скачать PDF</button></div></td></tr>`).join('')}
      </tbody></table></div>` : '<div class="panel empty">Отчётов пока нет. Первый появится здесь после окончания месяца.</div>'}`;
  $('content').querySelectorAll('[data-pdf]').forEach(b => b.onclick = () => downloadReport(b.dataset.pdf, b));
  $('content').querySelectorAll('[data-open]').forEach(b => b.onclick = async () => {
    try { const j = await call('report.view', { id: b.dataset.open }); showDrawer(`<div class="dh"><div><h3>Отчёт</h3></div><button class="x" id="dx">×</button></div><div class="db"><div class="actions" style="margin-top:0"><button class="btn" id="rpdf">Скачать PDF</button></div><div class="panel pad" style="margin-top:14px">${j.report.html}</div></div>`, null, true);
      $('dx').onclick = closeDrawer; $('rpdf').onclick = () => downloadReport(b.dataset.open, $('rpdf')); } catch (e) { toast(e.message, true); }
  });
}

// ===================== боковая панель и окна =====================
function showDrawer(html, rerender, wide) {
  const dr = $('drawer'); dr.innerHTML = html; dr.classList.toggle('wide', !!wide);
  dr.classList.add('open'); $('shade').classList.add('open');
  S.drawer = rerender || null;
}
function closeDrawer() { const dr = $('drawer'); if (!dr) return; dr.classList.remove('open'); $('shade').classList.remove('open'); S.drawer = null; }
$('shade').onclick = closeDrawer;
function openModal(html) { $('modalWrap').innerHTML = `<div class="modal-shade" id="mshade"></div><div class="modal" role="dialog">${html}</div>`; $('mshade').onclick = closeModal; }
function closeModal() { $('modalWrap').innerHTML = ''; }
// Вопрос с двумя ответами: true — да, false — нет, null — окно закрыли
function ask(html, yes, no) {
  return new Promise(res => {
    openModal(`${html}<div class="actions"><button class="btn" id="askY">${esc(yes)}</button><button class="btn ghost" id="askN">${esc(no)}</button></div>`);
    $('askY').onclick = () => { closeModal(); res(true); };
    $('askN').onclick = () => { closeModal(); res(false); };
    $('mshade').onclick = () => { closeModal(); res(null); };
  });
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('modalWrap').innerHTML) closeModal(); else closeDrawer(); } });
if (location.hash) S.view = location.hash.slice(1);

start();
